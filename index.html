=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polyline class=\"l\" points=\"55,205 115,85 185,190 255,70 330,200 385,120\"/><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">52°、74°、91°、63°、x</text></svg>"},{"id":"w9-q064","chapterId":"w9","level":"application","topic":"進階應用：凹六邊形","questionType":"diagram","text":"凹六邊形五個角為 96°、108°、74°、132°、210°，求 x。","math":"","options":{"A":"100°","B":"90°","C":"110°","D":"120°"},"answer":"A","hint":"先判斷是一般多邊形或正多邊形，再選用內角和、外角和或對角線公式。","explanation":"六邊形內角和720°，已知和620°，x=100°。","displayId":"W09-Q064","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"70,55 350,55 290,125 350,210 70,210 140,130\"/><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">六邊形：96、108、74、132、210、x</text></svg>"},{"id":"w9-q065","chapterId":"w9","level":"application","topic":"進階應用：雙星角度","questionType":"diagram","text":"雙星圖右星已知尖角 28°、34°、37°、42°，求 x。","math":"","options":{"A":"35°","B":"39°","C":"43°","D":"47°"},"answer":"B","hint":"先鎖定同一個五角星，五個尖角和為 180°。","explanation":"x=180°-28°-34°-37°-42°=39°。","displayId":"W09-Q065","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polyline class=\"l\" points=\"210,35 250,150 370,150 270,215 305,235 210,185 115,235 150,215 50,150 170,150 210,35\"/><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">28°、34°、37°、42°、x</text></svg>"},{"id":"w9-q066","chapterId":"w9","level":"application","topic":"進階應用：正多邊形套圖","questionType":"diagram","text":"正六邊形 ABCDEF 中連接 AC 與 AD，求 ∠CAD。","math":"","options":{"A":"30°","B":"45°","C":"60°","D":"90°"},"answer":"A","hint":"先判斷是一般多邊形或正多邊形，再選用內角和、外角和或對角線公式。","explanation":"正六邊形每段中心角60°，∠CAD 對到一段弧，所以是60°÷2=30°。","displayId":"W09-Q066","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"210,30 330,85 330,190 210,235 90,190 90,85\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"330\" y2=\"190\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"210\" y2=\"235\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"90\" y2=\"190\"/><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">正六邊形，連AC、AD</text></svg>"},{"id":"w9-q067","chapterId":"w9","level":"application","topic":"進階應用：多層三角形追角","questionType":"diagram","text":"大三角形中，D 在 BC 上、E 在 AC 上；依圖求 ∠C。","math":"","options":{"A":"35°","B":"41°","C":"73°","D":"53°"},"answer":"C","hint":"先在小三角形 ADE 求 ∠DAE，再合成大三角形的頂角。","explanation":"△ADE中∠DAE=180°-118°-41°=21°；大∠A=32°+21°=53°；∠C=180°-54°-53°=73°。","displayId":"W09-Q067","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"210,35 70,210 350,210\"/><text class=\"t\" x=\"204\" y=\"28\">A</text><text class=\"t\" x=\"52\" y=\"228\">B</text><text class=\"t\" x=\"355\" y=\"228\">C</text><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">B=54°，BAD=32°，ADE=118°，AED=41°</text></svg>"},{"id":"w9-q068","chapterId":"w9","level":"application","topic":"進階應用：正十邊形內嵌角","questionType":"diagram","text":"正十邊形 ABCDEFGHIJ 中，連接 AC 與 AD，求 ∠CAD。","math":"","options":{"A":"36°","B":"54°","C":"18°","D":"72°"},"answer":"C","hint":"先求正十邊形相鄰頂點所對的中心角，再用內嵌角是所對中心角的一半。","explanation":"正十邊形相鄰中心角=360°÷10=36°。∠CAD 對到 C 到 D 的一段弧，所以 ∠CAD=36°÷2=18°。","displayId":"W09-Q068","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"210,25 285,48 345,105 345,180 285,232 210,245 135,232 75,180 75,105 135,48\"/><line class=\"l\" x1=\"210\" y1=\"25\" x2=\"345\" y2=\"105\"/><line class=\"l\" x1=\"210\" y1=\"25\" x2=\"345\" y2=\"180\"/><text class=\"t\" x=\"210\" y=\"20\">A</text><text class=\"t\" x=\"350\" y=\"108\">C</text><text class=\"t\" x=\"350\" y=\"184\">D</text><text class=\"s\" x=\"238\" y=\"70\">x</text><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">正十邊形，連AC與AD</text></svg>"},{"id":"w9-q069","chapterId":"w9","level":"application","topic":"進階應用：邊長範圍綜合","questionType":"diagram","text":"三角形兩邊為 14、23，第三邊為偶數且周長小於 55，有幾種？","math":"","options":{"A":"5種","B":"8種","C":"7種","D":"4種"},"answer":"D","hint":"先用「兩邊差 < 第三邊 < 兩邊和」找出範圍，再依題目限制篩選。","explanation":"三邊關係得9<x<37；周長限制得x<18；偶數為10、12、14、16，共4種。","displayId":"W09-Q069","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"210,35 70,210 350,210\"/><text class=\"t\" x=\"204\" y=\"28\">A</text><text class=\"t\" x=\"52\" y=\"228\">B</text><text class=\"t\" x=\"355\" y=\"228\">C</text><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">邊14、23、偶數x；周長&lt;55</text></svg>"},{"id":"w9-q070","chapterId":"w9","level":"application","topic":"進階應用：內角差與對角線","questionType":"diagram","text":"某正多邊形每個內角比正六邊形每個內角多 24°，求它的對角線總數。","math":"","options":{"A":"27條","B":"44條","C":"20條","D":"35條"},"answer":"D","hint":"先知道正六邊形內角是120°，加上24°得到目標內角，再反推邊數與對角線。","explanation":"目標內角=120°+24°=144°，外角=36°，邊數=360°÷36°=10。對角線總數=10×7÷2=35條。","displayId":"W09-Q070","difficulty":"advanced","diagramSvg":"<svg class=\"diagram\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"題目圖形\" xmlns=\"http://www.w3.org/2000/svg\"><defs><style>.o{fill:#fff;stroke:#222;stroke-width:2.2}.g{fill:#eee;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#777;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.t{font:16px sans-serif;fill:#222}.s{font:13px sans-serif;fill:#222}.b{font:15px sans-serif;font-weight:700;fill:#222}</style></defs><polygon class=\"o\" points=\"210,30 330,85 330,190 210,235 90,190 90,85\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"330\" y2=\"190\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"210\" y2=\"235\"/><line class=\"d\" x1=\"210\" y1=\"30\" x2=\"90\" y2=\"190\"/><text class=\"b\" x=\"210\" y=\"248\" text-anchor=\"middle\">比正六邊形內角多24°</text></svg>"}];
</script>
<script>
const STORAGE_KEY="liviaMathPracticeWrongIds";
let currentQuestions=[];
let currentMode="practice";
let parentReview=false;
const $=id=>document.getElementById(id);
const labelMap={basic:"基礎",medium:"中等應用",advanced:"進階應用",application:"應用題"};
$("updateDate").textContent=updatedAt;

function selectedRadio(name){return document.querySelector(`input[name="${name}"]:checked`)?.value}
function shuffle(arr){arr=[...arr];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function getWrongIds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}
function setWrongIds(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(ids)]))}
function notice(msg){$("setupNotice").textContent=msg||""}

function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function formatMath(s){
  let out=escapeHtml(s);
  out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);
  out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);
  out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup>${n}</sup>`);
  return out;
}
function displayId(q){return q.displayId || q.id.toUpperCase()}
function isDiagram(q){return Boolean(q.diagramSvg || q.diagram || q.svg) || q.questionType==="diagram"}
function renderDiagram(q){
  const raw=q.diagramSvg || q.svg || q.diagram || "";
  return raw ? `<div class="diagram-wrap">${raw}</div>` : "";
}
function normalizeOption(s){return String(s).replace(/（誤\d+）|\(誤\d+\)/g,"").replace(/\s|　/g,"").replace(/[０-９]/g,d=>"０１２３４５６７８９".indexOf(d))}

function renderChapters(){
  const phase=selectedRadio("phase") || "all";
  const grid=$("chapterGrid");
  grid.innerHTML="";
  const counts={};
  questionBank.forEach(q=>counts[q.chapterId]=(counts[q.chapterId]||0)+1);
  chapters.filter(ch=>phase==="all" || String(ch.phase)===phase).forEach(ch=>{
    const arr=questionBank.filter(q=>q.chapterId===ch.id);
    const diagramCount=arr.filter(isDiagram).length;
    const label=document.createElement("label");
    label.className="chapter-card" + (arr.length===0 ? " empty-chapter" : "");
    const empty=arr.length===0;
    label.innerHTML=`<input type="checkbox" class="chapter-check" value="${ch.id}" ${empty?"disabled":""}>
      <div class="week">第 ${ch.week} 週｜${ch.date||""}</div>
      <div class="chapter-title">${ch.title}</div>
      <span class="badge">${arr.length} 題</span>
      <span class="badge">圖形 ${diagramCount}</span>`;
    const input=label.querySelector("input");
    if(empty){
      label.addEventListener("click",e=>{
        e.preventDefault();
        notice(`第 ${ch.week} 週「${ch.title}」題庫待建置，請先選擇第 1–9 週。`);
      });
    }else{
      input.addEventListener("change",()=>label.classList.toggle("selected",input.checked));
    }
    grid.appendChild(label);
  });
}
document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));
renderChapters();

function selectVisibleChapters(checked){
  document.querySelectorAll(".chapter-card:not(.empty-chapter)").forEach(card=>{
    const input=card.querySelector("input");
    input.checked=checked;
    card.classList.toggle("selected",checked);
  });
}
function selectChapter(chapterId){
  document.querySelectorAll(".chapter-card").forEach(card=>{
    const input=card.querySelector("input");
    const checked=input.value===chapterId && !card.classList.contains("empty-chapter");
    input.checked=checked;
    card.classList.toggle("selected",checked);
  });
}

function applyFilters(pool){
  const level=selectedRadio("level") || "all";
  const diff=selectedRadio("difficulty") || "all";
  const diagram=selectedRadio("diagram") || "all";
  if(level!=="all") pool=pool.filter(q=>q.level===level);
  if(diff!=="all") pool=pool.filter(q=>q.difficulty===diff);
  if(diagram==="diagram") pool=pool.filter(isDiagram);
  if(diagram==="nonDiagram") pool=pool.filter(q=>!isDiagram(q));
  return pool;
}

function chooseQuestions(pool,count){
  const desired=Number(count);
  const level=selectedRadio("level") || "all";
  const diff=selectedRadio("difficulty") || "all";
  if(level==="all" && diff==="all"){
    const apps=shuffle(pool.filter(q=>q.level==="application"));
    const basics=shuffle(pool.filter(q=>q.level==="basic"));
    const appTarget=Math.min(apps.length,Math.round(desired*0.25));
    const basicTarget=Math.min(basics.length,desired-appTarget);
    let picked=[...basics.slice(0,basicTarget),...apps.slice(0,appTarget)];
    if(picked.length<desired){
      const used=new Set(picked.map(q=>q.id));
      picked=picked.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,desired-picked.length));
    }
    return shuffle(picked).slice(0,desired);
  }
  return shuffle(pool).slice(0,desired);
}

function generateQuiz(){
  notice("");
  currentMode=selectedRadio("mode") || "practice";
  parentReview=$("parentReview").checked;
  const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);
  const count=selectedRadio("count") || "10";
  let pool=[];
  if(currentMode==="wrong"){
    pool=questionBank.filter(q=>getWrongIds().includes(q.id));
    if(selected.length) pool=pool.filter(q=>selected.includes(q.chapterId));
  }else{
    if(!selected.length){notice("請至少選擇一個已建置題目的章節。");return}
    pool=questionBank.filter(q=>selected.includes(q.chapterId));
  }
  pool=applyFilters(pool);
  if(!pool.length){notice("目前沒有符合條件的題目。");return}
  currentQuestions=chooseQuestions(pool,count);
  if(!currentQuestions.length){notice("符合條件的題目不足。");return}
  renderQuiz(selected);
  $("setupPage").classList.remove("active");
  $("quizPage").classList.add("active");
  scrollTo(0,0);
}

function formatExplanation(q){
  const mathStep=q.math ? `<div class="step"><b>列式／觀察：</b>${formatMath(q.math)}</div>` : "";
  return `<div class="step"><b>解題方向：</b>${formatMath(q.hint)}</div>
  ${mathStep}
  <div class="step"><b>計算：</b>${formatMath(q.explanation)}</div>
  <div class="step"><b>答案：</b>${q.answer}. ${formatMath(q.options[q.answer])}</div>`;
}
function renderQuiz(selected){
  const cont=$("quizContainer");
  cont.className=(parentReview?"parent-review ":"")+(currentMode==="quiz"?"quiz-mode":"");
  cont.innerHTML="";
  const app=currentQuestions.filter(q=>q.level==="application").length;
  const diagram=currentQuestions.filter(isDiagram).length;
  const advanced=currentQuestions.filter(q=>q.difficulty==="advanced").length;
  const names=selected.map(id=>chapters.find(c=>c.id===id)?.title).filter(Boolean).join("、") || "錯題複習";
  $("quizSummary").innerHTML=`<span class="tag">章節：${names}</span><span class="tag">題數：${currentQuestions.length}</span><span class="tag">應用題：${app}</span><span class="tag">圖形題：${diagram}</span><span class="tag">進階：${advanced}</span><span class="tag">${parentReview?"家長檢查":"一般作答"}</span>`;
  currentQuestions.forEach((q,i)=>{
    const ch=chapters.find(c=>c.id===q.chapterId);
    const sec=document.createElement("section");
    sec.className="question";
    sec.dataset.id=q.id;
    sec.dataset.answer=q.answer;
    const optionButtons=Object.entries(q.options).map(([k,v])=>{
      const cls=(parentReview && k===q.answer)?"option correct":"option";
      const disabled=parentReview?"disabled":"";
      return `<button class="${cls}" data-choice="${k}" ${disabled}>${k}. ${formatMath(v)}</button>`;
    }).join("");
    const parentAnswer=parentReview?`<div class="parent-answer">正確答案：${q.answer}. ${formatMath(q.options[q.answer])}</div>`:"";
    sec.innerHTML=`<div class="q-head">
        <div><div class="q-id">${displayId(q)}</div><div class="qmeta">第 ${ch?.week||""} 週｜${ch?.title||""}</div></div>
        <div class="qmeta"><span class="tag">${q.level==="basic"?"基本題":"應用題"}</span><span class="tag">${labelMap[q.difficulty]||q.difficulty}</span><span class="tag">${isDiagram(q)?"圖形題":"非圖形"}</span><span class="tag">${formatMath(q.topic||"")}</span></div>
      </div>
      <div class="qtext">${i+1}. ${formatMath(q.text)}</div>
      ${renderDiagram(q)}
      ${q.level==="application" || !q.math ? "" : `<div class="math">${formatMath(q.math)}</div>`}
      <div class="options">${optionButtons}</div>
      ${parentAnswer}
      <details class="hint" ${parentReview?"open":""}><summary>提示</summary>${formatMath(q.hint)}</details>
      <div class="explanation ${parentReview?"show":""}">${formatExplanation(q)}</div>`;
    sec.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(sec,btn)));
    cont.appendChild(sec);
  });
  updateScore();
}

function answer(sec,btn){
  if(parentReview || sec.dataset.answered==="true") return;
  const ok=btn.dataset.choice===sec.dataset.answer;
  sec.dataset.answered="true";
  sec.dataset.correct=ok?"true":"false";
  sec.querySelectorAll(".option").forEach(o=>{
    o.disabled=true;
    if(o.dataset.choice===sec.dataset.answer) o.classList.add("correct");
    if(o===btn && !ok) o.classList.add("wrong");
  });
  const mark=document.createElement("div");
  mark.className="result "+(ok?"good":"bad");
  mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";
  if(ok) setWrongIds(getWrongIds().filter(id=>id!==sec.dataset.id));
  else setWrongIds([...getWrongIds(),sec.dataset.id]);
  const exp=sec.querySelector(".explanation");
  exp.before(mark);
  exp.classList.add("show");
  updateScore();
}

function updateScore(){
  if(parentReview){$("score").textContent=`家長檢查｜共 ${currentQuestions.length} 題`;return}
  let answered=0,correct=0;
  document.querySelectorAll("#quizContainer .question").forEach(q=>{
    if(q.dataset.answered==="true"){
      answered++;
      if(q.dataset.correct==="true") correct++;
    }
  });
  $("score").textContent=`已答 ${answered} / ${currentQuestions.length}，答對 ${correct} 題`;
}
function backToSetup(){$("quizPage").classList.remove("active");$("setupPage").classList.add("active");scrollTo(0,0)}
function expandHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=true)}
function collapseHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=false)}
function clearWrongBook(){if(confirm("確定清空錯題紀錄嗎？")){setWrongIds([]);alert("已清空錯題紀錄")}}

function runSelfCheck(){
  const ids=new Set(), sigs=new Set();
  let duplicateId=0, duplicateQuestion=0, duplicateOptions=0, invalidAnswer=0, missingHint=0, missingExplanation=0;
  questionBank.forEach(q=>{
    if(ids.has(q.id)) duplicateId++;
    ids.add(q.id);
    const sig=q.chapterId+"|"+q.text+"|"+(q.math || ((q.topic||"")+"|"+q.explanation));
    if(sigs.has(sig)) duplicateQuestion++;
    sigs.add(sig);
    if(!(q.answer in q.options)) invalidAnswer++;
    if(new Set(Object.values(q.options).map(normalizeOption)).size!==4) duplicateOptions++;
    if(!q.hint || q.hint.length<20) missingHint++;
    if(!q.explanation) missingExplanation++;
  });
  const builtWeeks=[...new Set(questionBank.map(q=>Number((q.chapterId||"").replace("w",""))))].filter(Boolean).sort((a,b)=>a-b);
  const weeklyOk=builtWeeks.every(w=>{
    const arr=questionBank.filter(q=>q.chapterId==="w"+w);
    return arr.length===70 && arr.filter(q=>q.level==="basic").length===50 && arr.filter(q=>q.level==="application").length===20;
  });
  const w8=questionBank.filter(q=>q.chapterId==="w8");
  const w8NoExposedMath=w8.every(q=>!q.math);
  const w8StructureOk=w8.length===70 && w8.filter(q=>q.level==="basic").length===50 && w8.filter(q=>q.level==="application").length===20 && w8.filter(q=>q.difficulty==="medium").length===12 && w8.filter(q=>q.difficulty==="advanced").length===8;
  const w9DifficultyOk=questionBank.filter(q=>q.chapterId==="w9" && q.difficulty==="medium").length===12 && questionBank.filter(q=>q.chapterId==="w9" && q.difficulty==="advanced").length===8;
  const countOptions=[...document.querySelectorAll('input[name="count"]')].map(x=>x.value).join(",");
  const w9=questionBank.filter(q=>q.chapterId==="w9");
  const w9DiagramCount=w9.filter(isDiagram).length;
  const w9StructureOk=w9.length===70 && w9.filter(q=>q.level==="basic").length===50 && w9.filter(q=>q.difficulty==="medium").length===12 && w9.filter(q=>q.difficulty==="advanced").length===8;
  const w9BasicDiagramOk=w9.filter(q=>q.level==="basic").filter(isDiagram).length>=35;
  const w9MediumDiagramOk=w9.filter(q=>q.difficulty==="medium").filter(isDiagram).length>=10;
  const w9AdvancedDiagramOk=w9.filter(q=>q.difficulty==="advanced").filter(isDiagram).length>=7;
  const w9DiagramOk=w9DiagramCount>=55 && w9BasicDiagramOk && w9MediumDiagramOk && w9AdvancedDiagramOk;
  const advancedCollapsed=document.querySelector("details.advanced") && !document.querySelector("details.advanced").open;
  const selfcheckCollapsed=document.querySelector("details.selfcheck") && !document.querySelector("details.selfcheck").open;
  const pass=weeklyOk && w8StructureOk && w8NoExposedMath && w9DifficultyOk && w9StructureOk && w9DiagramOk && duplicateId===0 && duplicateQuestion===0 && duplicateOptions===0 && invalidAnswer===0 && missingHint===0 && missingExplanation===0 && countOptions==="10,20,30" && advancedCollapsed && selfcheckCollapsed;
  $("selfCheckBox").textContent=[
    "目前建置範圍：第 " + (builtWeeks[0]||"-") + "–" + (builtWeeks[builtWeeks.length-1]||"-") + " 週",
    "題庫總數：" + questionBank.length,
    "每週 50 基本 + 20 應用：" + (weeklyOk?"PASS":"FAIL"),
    "第 8 週 70 題與 50/12/8：" + (w8StructureOk?"PASS":"FAIL"),
    "第 8 週題目頁不外露列式：" + (w8NoExposedMath?"PASS":"FAIL"),
    "第 9 週 12 中等應用 + 8 進階應用：" + (w9DifficultyOk?"PASS":"FAIL"),
    "第 9 週 70 題與 50/12/8：" + (w9StructureOk?"PASS":"FAIL"),
    "第 9 週圖形題至少 55 題：" + w9DiagramCount + " / 55 " + (w9DiagramOk?"PASS":"FAIL"),
    "題目 ID 重複：" + duplicateId,
    "題目文字重複：" + duplicateQuestion,
    "同題選項重複：" + duplicateOptions,
    "答案鍵錯誤：" + invalidAnswer,
    "提示不足：" + missingHint,
    "缺少詳解：" + missingExplanation,
    "題數選項：" + countOptions,
    "進階設定預設收合：" + (advancedCollapsed?"PASS":"FAIL"),
    "Self Check 預設收合：" + (selfcheckCollapsed?"PASS":"FAIL"),
    "",
    pass?"OVERALL: PASS":"OVERALL: FAIL"
  ].join("\n");
}
runSelfCheck();
</script>
