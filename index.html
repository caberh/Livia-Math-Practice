<style>

,1fr);gap:10px}.chapter-card{position:relative;display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;cursor:pointer;min-height:112px;touch-action:manipulation}.chapter-card input{position:absolute;top:12px;right:12px}.chapter-card.selected{outline:3px solid rgba(63,111,100,.28);background:var(--soft)}.week{font-weight:950;color:var(--accent);padding-right:28px}.chapter-title{font-weight:950;margin-top:4px}.chapter-date{color:var(--muted);font-size:13px}.badge{display:inline-block;margin-top:8px;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}.ready{background:#edf8ef;color:var(--right);border:1px solid #cce8d2}.empty{background:var(--cream);color:#87691a;border:1px solid #ecdba5}.notice{display:none;margin-top:12px;padding:12px;border-radius:16px;background:var(--cream);border:1px solid #ecdba5;color:#7a6016;font-weight:850}.notice.show{display:block}.quizbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0 16px;padding:12px;background:rgba(251,247,240,.94);border-bottom:1px solid var(--line)}.score,.tag{background:#fffdf8;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-weight:900}.summary{display:flex;gap:8px;flex-wrap:wrap}.question{padding:20px;margin:16px 0;background:#fff}.q-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}.qno,.qmeta{border-radius:999px;padding:3px 10px;font-weight:950}.qno{background:var(--soft);color:var(--accent);border:1px solid #d4e8e0}.qmeta{background:#fffaf0;color:var(--muted);border:1px solid #eadbb8;font-size:13px}.qtext{font-weight:900;font-size:18px}.math{margin-top:10px;font-size:19px;background:#fffaf0;border:1px dashed #ead7a5;padding:12px;border-radius:14px;overflow-x:auto;white-space:nowrap}.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 2px;line-height:1.05;font-weight:900}.frac .top{border-bottom:2px solid currentColor;padding:0 4px 2px}.frac .bottom{padding:2px 4px 0}.mixed{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}.exp{font-size:.68em;line-height:0;vertical-align:super;margin-left:1px;font-weight:900}.options{display:grid;gap:10px;margin-top:14px}.option{width:100%;min-height:48px;text-align:left;border:1px solid var(--line);background:#fffdf8;color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:850;touch-action:manipulation}.option.correct{background:#edf8ef;border-color:var(--right);color:#2e6843}.option.wrong{background:#fff0ee;border-color:var(--wrong);color:#91423c}details{margin-top:14px;border-radius:16px;border:1px solid #ecdba5;background:var(--cream);padding:10px}.quiz-mode details{display:none}.explanation{display:none;margin-top:14px;padding:13px;border-radius:16px;border:1px solid #cfe3dc;background:var(--soft)}.explanation.show{display:block}.result{display:inline-block;margin-top:10px;font-weight:950}.good{color:var(--right)}.bad{color:var(--wrong)}.footer{text-align:center;color:var(--muted);padding:24px 16px 6px;font-size:14px}@media(max-width:1180px){.wrap{max-width:100%;padding:22px 18px 38px}.chapter-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.meta-grid,.controls,.chapter-grid{grid-template-columns:repeat(2,1fr)}.quizbar{position:static;justify-content:flex-start}.copyright{position:absolute}.hero,.card,.question{border-radius:20px}}@media(max-width:640px){.meta-grid,.controls,.chapter-grid{grid-template-columns:1fr}.wrap{padding:20px 14px 34px}.chapter-tools button{width:100%}.quizbar button{flex:1 1 140px}.score{width:100%;text-align:center}}@media print{.copyright,.quizbar,#setupPage,.footer{display:none!important}.hero,.card,.question{box-shadow:none}details,.explanation{display:none!important}.question{break-inside:avoid}}
</style></head><body><div class="copyright">© Capt. Caber</div><div class="wrap"><section class="hero"><h1>Livia Math Practice</h1><p class="subtitle">私中數學練習產生器｜設定頁與試題頁分離版</p><div class="meta-grid"><div class="meta"><div class="label">更新日期</div><div class="value" id="updateDate"></div></div><div class="meta"><div class="label">支援週次</div><div class="value">第 1–36 週</div></div><div class="meta"><div class="label">已建置題庫</div><div class="value">第 7 週｜20 題</div></div><div class="meta"><div class="label">網頁檔名</div><div class="value">index.html</div></div></div></section>
<main id="setupPage" class="page active"><section class="card"><h2>1. 選擇練習設定</h2><div class="controls"><div class="control-box"><div class="control-title">階段</div><label class="pill"><input type="radio" name="phase" value="all" checked>全部</label><label class="pill"><input type="radio" name="phase" value="1">第一階段</label><label class="pill"><input type="radio" name="phase" value="2">第二階段</label></div><div class="control-box"><div class="control-title">題數</div><label class="pill"><input type="radio" name="count" value="10" checked>10 題</label><label class="pill"><input type="radio" name="count" value="20">20 題</label><label class="pill"><input type="radio" name="count" value="30">30 題</label><label class="pill"><input type="radio" name="count" value="all">全部</label></div><div class="control-box"><div class="control-title">模式</div><label class="pill"><input type="radio" name="mode" value="practice" checked>練習模式</label><label class="pill"><input type="radio" name="mode" value="quiz">小考模式</label><label class="pill"><input type="radio" name="mode" value="wrong">錯題複習</label></div></div><div class="notice" id="setupNotice"></div></section><section class="card"><h2>2. 選擇章節</h2><div class="chapter-tools"><button class="secondary" onclick="selectVisibleChapters(true)">選取目前顯示章節</button><button class="secondary" onclick="selectVisibleChapters(false)">清除目前顯示章節</button><button class="secondary" onclick="selectReadyChapters()">只選已有題庫章節</button></div><div class="chapter-grid" id="chapterGrid"></div></section><section class="card"><h2>3. 產生試題</h2><p style="color:var(--muted);font-weight:850">首頁只放設定；按下產生後才進入試題頁，避免題庫越來越多時頁面過長。</p><button onclick="generateQuiz()">產生試題</button></section></main>
<main id="quizPage" class="page"><div class="quizbar"><button class="secondary" onclick="backToSetup()">返回設定</button><button class="secondary" onclick="generateQuiz()">重新產生</button><button class="secondary" onclick="expandHints()">全部打開提示</button><button class="secondary" onclick="collapseHints()">全部收合提示</button><button class="secondary" onclick="window.print()">列印題目</button><button class="warn" onclick="clearWrongBook()">清空錯題紀錄</button><span class="score" id="score">已答 0 / 0，答對 0 題</span></div><section class="card"><h2>本次練習</h2><div class="summary" id="quizSummary"></div></section><div id="quizContainer"></div></main><div class="footer">© Capt. Caber｜Livia Math Practice｜single-file index.html</div></div>
<script>
const updatedAt="2026-05-27";
const chapters=[
...Array.from({length:18},(_,i)=>({id:`w${i+1}`,week:i+1,phase:1,date:["4/11","4/18","4/25","5/02","5/09","5/16","5/23","5/30","6/06","6/13","6/27","6/29","7/11","7/18","7/20","7/25","8/01","8/08"][i],title:["正數與負數","指數律與科學記號","分數的乘除與小數的除法","四則運算","簡化計算（上）","簡化計算（下）","長式子的四則運算","周長、面積、表面積","三角形與多邊形","平行與四邊形","一次式的值與化簡","一元一次方程式","一元一次方程式並求解","因數與倍數","特殊倍數與質數、質因數","最大公因數","最小公倍數","圓與扇形"][i]})),
...Array.from({length:18},(_,i)=>({id:`w${i+19}`,week:i+19,phase:2,date:["8/15","8/17","8/29","9/05","9/12","9/19","10/3","10/10","10/17","10/24","10/31","11/7","11/14","11/21","11/28","12/5","12/12","12/19"][i],title:["比與比值","正反比與比例尺","數列與規律","間隔問題","時間","點決定直線、基準量與比較量","母子和、母子差","相當、速率的單位換算","相對速度的應用","柱體、錐體與容積","平均問題、雞兔問題","年齡問題、方陣問題","工程問題、邏推問題","過與不足、替換組合","購與賠的問題","解二元一次聯立方程式","比較消去與濃度問題","簡單機率"][i]}))];
const rawQuestions=[["(-6) × [8 - 3 × (5 - 9)]",["-120","-72","72","120"],"A","先算小括號，再算中括號。","5-9=-4，3×(-4)=-12，中括號 8-(-12)=20，(-6)×20=-120。"],["48 - [(-18) + 6 × (-5)]",["0","36","96","-96"],"C","中括號內先乘除後加減。","6×(-5)=-30，-18+(-30)=-48，所以 48-(-48)=96。"],["|(-4) × (3 - 11)| - |(-6) × 5|",["2","12","32","62"],"A","絕對值內先算完。","3-11=-8，(-4)×(-8)=32；|(-6)×5|=30，所以 32-30=2。"],["35 × (-8) + 15 × (-8)",["-160","-280","-400","400"],"C","可以提出共同的 (-8)。","(35+15)×(-8)=50×(-8)=-400。"],["|-7 × (4 - 10)| + 6 × (-8)",["-6","6","-90","90"],"A","先處理絕對值。","4-10=-6，-7×(-6)=42；6×(-8)=-48，所以 42-48=-6。"],["(-2)^4 - 3^2 × 2",["-2","2","14","34"],"A","先算指數，再做乘法。","(-2)^4=16，3^2×2=18，所以 16-18=-2。"],["-3^2 + (-3)^2 + 4",["-14","-4","4","13"],"C","注意 -3^2 和 (-3)^2 不同。","-3^2=-9，(-3)^2=9，所以 -9+9+4=4。"],["36 - [(-2)^3 × 5 + 60 ÷ 3]",["56","40","-24","24"],"A","中括號內的指數、乘除先算。","(-2)^3=-8，×5=-40；60÷3=20；中括號=-20，36-(-20)=56。"],["[(-48) ÷ 6 - 7] × (-3)",["-45","45","-3","3"],"B","先算中括號。","(-48)÷6=-8，-8-7=-15，(-15)×(-3)=45。"],["64 × (-7) + 36 × (-7)",["-700","-448","700","196"],"A","提出共同因數 -7。","(64+36)×(-7)=100×(-7)=-700。"],["1/2 + 3/4 - 5/8",["3/8","5/8","7/8","9/8"],"B","通分成分母 8。","4/8+6/8-5/8=5/8。"],["3/5 ÷ (-9/10) × 6",["-4","-2/5","4","2/5"],"A","除以分數等於乘以倒數。","3/5×(-10/9)=-2/3，再乘 6 得 -4。"],["2 1/3 - 1 5/6",["1/2","2/3","5/6","1 1/2"],"A","改成假分數。","2 1/3=14/6，1 5/6=11/6，差為 3/6=1/2。"],["1/(-3)^2 - 4/(-3)^3",["-1/27","1/27","7/27","5/9"],"C","先算次方，注意奇偶次方正負。","1/9-4/(-27)=1/9+4/27=7/27。"],["0.25 × (-12) + 1/2 × 10",["-8","-3","2","8"],"C","0.25 可以看成 1/4。","0.25×(-12)=-3，1/2×10=5，合計 2。"],["(3/4 - 5/6) ÷ (-1/12)",["-1","1","-7","7"],"B","括號內先通分。","3/4=9/12，5/6=10/12，括號=-1/12；除以 -1/12 得 1。"],["|-3/4| + |-5/6| - 1/2",["7/12","13/12","-7/12","1/12"],"B","絕對值會變成正分數。","3/4+5/6-1/2=9/12+10/12-6/12=13/12。"],["24 ÷ [3 × (-2) + 10]",["4","6","-4","-6"],"B","先算中括號。","3×(-2)=-6，中括號=4，24÷4=6。"],["18.6 × (-5/3) + 12.6 × (5/3)",["-10","-8","8","10"],"A","可提出 5/3。","(5/3)×(-18.6+12.6)=(5/3)×(-6)=-10。"],["|(-4)^2 - 5^2| + [(-18) ÷ 3] × (-2)",["3","9","21","33"],"C","先算指數與絕對值。","|16-25|=9；(-18)÷3=-6，(-6)×(-2)=12；合計 21。"]];
const questionBank=rawQuestions.map((r,i)=>({id:`w7-q${String(i+1).padStart(2,"0")}`,chapterId:"w7",topic:"長式子的四則運算",text:"計算下列式子的值：",math:r[0],options:{A:r[1][0],B:r[1][1],C:r[1][2],D:r[1][3]},answer:r[2],hint:r[3],explanation:r[4]}));
const STORAGE_KEY="liviaMathPracticeWrongIds";let currentQuestions=[],currentMode="practice";const $=id=>document.getElementById(id);$("updateDate").textContent=updatedAt;
function wrongIds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}function setWrong(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(ids)]))}function selectedRadio(n){return document.querySelector(`input[name="${n}"]:checked`).value}function hasQ(id){return questionBank.some(q=>q.chapterId===id)}function modeName(m){return m==="practice"?"練習模式":m==="quiz"?"小考模式":"錯題複習"}
function renderChapters(){const phase=selectedRadio("phase"),grid=$("chapterGrid");grid.innerHTML="";chapters.filter(ch=>phase==="all"||String(ch.phase)===phase).forEach(ch=>{const ready=hasQ(ch.id),label=document.createElement("label");label.className="chapter-card";label.innerHTML=`<input type="checkbox" class="chapter-check" value="${ch.id}"><div class="week">第 ${ch.week} 週｜第 ${ch.phase} 階段</div><div class="chapter-title">${ch.title}</div><div class="chapter-date">${ch.date}</div><span class="badge ${ready?"ready":"empty"}">${ready?"已建置題目":"尚未建置題目"}</span>`;const input=label.querySelector("input");input.addEventListener("change",()=>label.classList.toggle("selected",input.checked));grid.appendChild(label)})}document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));renderChapters();
function selectVisibleChapters(checked){document.querySelectorAll(".chapter-card").forEach(card=>{const input=card.querySelector("input");input.checked=checked;card.classList.toggle("selected",checked)})}function selectReadyChapters(){document.querySelectorAll(".chapter-card").forEach(card=>{const input=card.querySelector("input"),checked=hasQ(input.value);input.checked=checked;card.classList.toggle("selected",checked)})}function notice(msg){$("setupNotice").textContent=msg;$("setupNotice").classList.add("show")}function clearNotice(){$("setupNotice").textContent="";$("setupNotice").classList.remove("show")}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateQuiz(){clearNotice();currentMode=selectedRadio("mode");const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);let pool=[];if(currentMode==="wrong"){pool=questionBank.filter(q=>wrongIds().includes(q.id));if(selected.length)pool=pool.filter(q=>selected.includes(q.chapterId));if(!pool.length){notice("目前沒有符合條件的錯題紀錄。");return}}else{if(!selected.length){notice("請至少選擇一個章節。");return}pool=questionBank.filter(q=>selected.includes(q.chapterId));if(!pool.length){notice("你選到的章節目前尚未建置題目。請先選第 7 週，或之後再新增該章題庫。");return}}const count=selectedRadio("count"),wanted=count==="all"?pool.length:Number(count);currentQuestions=shuffle(pool).slice(0,Math.min(wanted,pool.length));renderQuiz(selected);$("setupPage").classList.remove("active");$("quizPage").classList.add("active");scrollTo({top:0,behavior:"smooth"})}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function formatMath(s){let out=escapeHtml(s);out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup class="exp">${n}</sup>`);return out}function renderQuiz(selected){const cont=$("quizContainer");cont.className=currentMode==="quiz"?"quiz-mode":"";cont.innerHTML="";const names=selected.map(id=>chapters.find(c=>c.id===id)?.title||id);$("quizSummary").innerHTML=`<span class="tag">更新日期：${updatedAt}</span><span class="tag">模式：${modeName(currentMode)}</span><span class="tag">題數：${currentQuestions.length} 題</span><span class="tag">章節：${names.length?names.join("、"):"錯題複習"}</span>`;currentQuestions.forEach((q,i)=>{const ch=chapters.find(c=>c.id===q.chapterId),sec=document.createElement("section");sec.className="question";sec.dataset.answer=q.answer;sec.dataset.id=q.id;sec.dataset.answered="false";sec.dataset.correct="false";sec.innerHTML=`<div class="q-head"><span class="qno">第 ${i+1} 題</span><span class="qmeta">第 ${ch.week} 週｜${ch.title}｜${q.topic}</span></div><div class="qtext">${q.text}</div><div class="math">${formatMath(q.math)}</div><div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option" data-choice="${k}">${k}. ${formatMath(v)}</button>`).join("")}</div><details><summary>提示</summary>${q.hint}</details><div class="explanation"><b>詳解：</b>${q.explanation}</div>`;sec.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(sec,btn)));cont.appendChild(sec)});updateScore()}
function answer(sec,btn){if(sec.dataset.answered==="true")return;const ok=btn.dataset.choice===sec.dataset.answer;sec.dataset.answered="true";sec.dataset.correct=ok?"true":"false";sec.querySelectorAll(".option").forEach(o=>{o.disabled=true;if(o.dataset.choice===sec.dataset.answer)o.classList.add("correct")});const mark=document.createElement("div");mark.className="result "+(ok?"good":"bad");mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";if(!ok){btn.classList.add("wrong");setWrong([...wrongIds(),sec.dataset.id])}else{setWrong(wrongIds().filter(x=>x!==sec.dataset.id))}const exp=sec.querySelector(".explanation");exp.before(mark);exp.classList.add("show");updateScore()}function updateScore(){let a=0,c=0;document.querySelectorAll("#quizContainer .question").forEach(q=>{if(q.dataset.answered==="true"){a++;if(q.dataset.correct==="true")c++}});$("score").textContent=`已答 ${a} / ${currentQuestions.length}，答對 ${c} 題`}function backToSetup(){$("quizPage").classList.remove("active");$("setupPage").classList.add("active");scrollTo({top:0,behavior:"smooth"})}function expandHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=true)}function collapseHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=false)}function clearWrongBook(){if(confirm("確定要清空這個瀏覽器裡的錯題紀錄嗎？")){setWrong([]);alert("錯題紀錄已清空。")}}
</script></body></html>
