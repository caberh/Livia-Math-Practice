st q of questionBank){add(!ids.has(q.id),`ID 不重複：${q.id}`);ids.add(q.id);const sig=q.chapterId+"|"+q.text+"|"+q.math;add(!sigs.has(sig),`題目不重複：${q.id}`);sigs.add(sig);const vals=Object.values(q.options);add(vals.length===4&&new Set(vals).size===4,`選項不重複：${q.id}`);add(["A","B","C","D"].includes(q.answer),`答案代碼有效：${q.id}`);add(Boolean(q.hint&&q.explanation),`提示與詳解存在：${q.id}`)}$("selfCheckBox").textContent=lines.join("\n")+"\n"+(ok?"\nOVERALL: PASS":"\nOVERALL: FAIL")}runSelfCheck();</script></body></html>
