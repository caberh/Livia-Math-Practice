-q37", "chapterId": "w7", "level": "basic", "topic": "次方負號判斷", "questionType": "text", "text": "計算下列長式子的值：", "math": "(-3)^2 - 4^2 - 3^3", "options": {"A": "-33", "B": "-34", "C": "-35", "D": "-32"}, "answer": "B", "hint": "有括號的負底數平方會變正；後面的減法要照順序。", "explanation": "(-3)^2=9，4^2=16，3^3=27，所以 9-16-27=-34。"}, {"id": "w7-q38", "chapterId": "w7", "level": "basic", "topic": "次方負號判斷", "questionType": "text", "text": "計算下列長式子的值：", "math": "(-4)^2 - 5^2 - 4^3", "options": {"A": "-72", "B": "-74", "C": "-73", "D": "-71"}, "answer": "C", "hint": "有括號的負底數平方會變正；後面的減法要照順序。", "explanation": "(-4)^2=16，5^2=25，4^3=64，所以 16-25-64=-73。"}, {"id": "w7-q39", "chapterId": "w7", "level": "basic", "topic": "次方負號判斷", "questionType": "text", "text": "計算下列長式子的值：", "math": "(-5)^2 - 6^2 - 2^3", "options": {"A": "-18", "B": "-20", "C": "-17", "D": "-19"}, "answer": "D", "hint": "有括號的負底數平方會變正；後面的減法要照順序。", "explanation": "(-5)^2=25，6^2=36，2^3=8，所以 25-36-8=-19。"}, {"id": "w7-q40", "chapterId": "w7", "level": "basic", "topic": "次方負號判斷", "questionType": "text", "text": "計算下列長式子的值：", "math": "(-6)^2 - 7^2 - 3^3", "options": {"A": "-40", "B": "-39", "C": "-41", "D": "-38"}, "answer": "A", "hint": "有括號的負底數平方會變正；後面的減法要照順序。", "explanation": "(-6)^2=36，7^2=49，3^3=27，所以 36-49-27=-40。"}, {"id": "w7-q41", "chapterId": "w7", "level": "basic", "topic": "分數絕對值", "questionType": "text", "text": "計算下列長式子的值：", "math": "|2/3 - 1/5| + 3/7", "options": {"A": "1 94/105", "B": "94/105", "C": "-11/105", "D": "2 94/105"}, "answer": "B", "hint": "先通分算絕對值裡的差，再加上後面的分數。", "explanation": "2/3-1/5=7/15，絕對值為 7/15；再加 3/7 得 94/105。"}, {"id": "w7-q42", "chapterId": "w7", "level": "basic", "topic": "分數絕對值", "questionType": "text", "text": "計算下列長式子的值：", "math": "|3/4 - 1/3| + 1/2", "options": {"A": "1 11/12", "B": "-1/12", "C": "11/12", "D": "2 11/12"}, "answer": "C", "hint": "先通分算絕對值裡的差，再加上後面的分數。", "explanation": "3/4-1/3=5/12，絕對值為 5/12；再加 1/2 得 11/12。"}, {"id": "w7-q43", "chapterId": "w7", "level": "basic", "topic": "分數絕對值", "questionType": "text", "text": "計算下列長式子的值：", "math": "|4/5 - 3/7| + 5/9", "options": {"A": "1 292/315", "B": "-23/315", "C": "2 292/315", "D": "292/315"}, "answer": "D", "hint": "先通分算絕對值裡的差，再加上後面的分數。", "explanation": "4/5-3/7=13/35，絕對值為 13/35；再加 5/9 得 292/315。"}, {"id": "w7-q44", "chapterId": "w7", "level": "basic", "topic": "分數絕對值", "questionType": "text", "text": "計算下列長式子的值：", "math": "|5/6 - 1/2| + 3/5", "options": {"A": "14/15", "B": "1 14/15", "C": "-1/15", "D": "2 14/15"}, "answer": "A", "hint": "先通分算絕對值裡的差，再加上後面的分數。", "explanation": "5/6-1/2=1/3，絕對值為 1/3；再加 3/5 得 14/15。"}, {"id": "w7-q45", "chapterId": "w7", "level": "basic", "topic": "分數絕對值", "questionType": "text", "text": "計算下列長式子的值：", "math": "|6/7 - 5/9| + 7/11", "options": {"A": "1 650/693", "B": "650/693", "C": "-43/693", "D": "2 650/693"}, "answer": "B", "hint": "先通分算絕對值裡的差，再加上後面的分數。", "explanation": "6/7-5/9=19/63，絕對值為 19/63；再加 7/11 得 650/693。"}, {"id": "w7-q46", "chapterId": "w7", "level": "basic", "topic": "中括號內乘除優先", "questionType": "text", "text": "計算下列長式子的值：", "math": "[48 ÷ 6 + (-4) × 3] - 20", "options": {"A": "-23", "B": "-25", "C": "-24", "D": "-22"}, "answer": "C", "hint": "中括號內也要先乘除後加減。", "explanation": "48÷6=8，(-4)×3=-12，中括號為 -4；再減 20 得 -24。"}, {"id": "w7-q47", "chapterId": "w7", "level": "basic", "topic": "中括號內乘除優先", "questionType": "text", "text": "計算下列長式子的值：", "math": "[60 ÷ 7 + (-5) × 4] - 22", "options": {"A": "-32 3/7", "B": "-34 3/7", "C": "-31 3/7", "D": "-33 3/7"}, "answer": "D", "hint": "中括號內也要先乘除後加減。", "explanation": "60÷7=8 4/7，(-5)×4=-20，中括號為 -11 3/7；再減 22 得 -33 3/7。"}, {"id": "w7-q48", "chapterId": "w7", "level": "basic", "topic": "中括號內乘除優先", "questionType": "text", "text": "計算下列長式子的值：", "math": "[72 ÷ 8 + (-6) × 5] - 24", "options": {"A": "-45", "B": "-44", "C": "-46", "D": "-43"}, "answer": "A", "hint": "中括號內也要先乘除後加減。", "explanation": "72÷8=9，(-6)×5=-30，中括號為 -21；再減 24 得 -45。"}, {"id": "w7-q49", "chapterId": "w7", "level": "basic", "topic": "中括號內乘除優先", "questionType": "text", "t const STORAGE_KEY="liviaMathPracticeWrongIds";
let currentQuestions=[], currentMode="practice";
const $=id=>document.getElementById(id);
$("updateDate").textContent=updatedAt;

function getWrongIds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}
function setWrongIds(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(ids)]))}
function selectedRadio(n){return document.querySelector(`input[name="${n}"]:checked`).value}
function hasQ(id){return questionBank.some(q=>q.chapterId===id)}
function modeName(m){return m==="practice"?"練習模式":m==="quiz"?"小考模式":"錯題複習"}
function levelName(l){return l==="basic"?"基本題":l==="application"?"應用題":"全部題型"}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function notice(msg){$("setupNotice").textContent=msg;$("setupNotice").classList.add("show")}
function clearNotice(){$("setupNotice").textContent="";$("setupNotice").classList.remove("show")}

function renderChapters(){
  const phase=selectedRadio("phase"), grid=$("chapterGrid");
  grid.innerHTML="";
  chapters.filter(ch=>phase==="all"||String(ch.phase)===phase).forEach(ch=>{
    const ready=hasQ(ch.id);
    const label=document.createElement("label");
    label.className="chapter-card";
    label.innerHTML=`<input type="checkbox" class="chapter-check" value="${ch.id}">
      <div class="week">第 ${ch.week} 週｜第 ${ch.phase} 階段</div>
      <div class="chapter-title">${ch.title}</div>
      <div class="chapter-date">${ch.date}</div>
      <span class="badge ${ready?"ready":"empty"}">${ready?"已建置題目":"尚未建置題目"}</span>`;
    const input=label.querySelector("input");
    input.addEventListener("change",()=>label.classList.toggle("selected",input.checked));
    grid.appendChild(label);
  });
}
document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));
renderChapters();

function selectVisibleChapters(checked){
  document.querySelectorAll(".chapter-card").forEach(card=>{
    const input=card.querySelector("input");
    input.checked=checked; card.classList.toggle("selected",checked);
  });
}
function selectReadyChapters(){
  document.querySelectorAll(".chapter-card").forEach(card=>{
    const input=card.querySelector("input");
    const checked=hasQ(input.value);
    input.checked=checked; card.classList.toggle("selected",checked);
  });
}

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function formatMath(s){
  let out=escapeHtml(s);
  out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);
  out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);
  out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup class="exp">${n}</sup>`);
  return out;
}

function generateQuiz(){
  clearNotice();
  currentMode=selectedRadio("mode");
  const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);
  const level=selectedRadio("level"), count=selectedRadio("count");
  let pool=[];
  if(currentMode==="wrong"){
    pool=questionBank.filter(q=>getWrongIds().includes(q.id));
    if(selected.length) pool=pool.filter(q=>selected.includes(q.chapterId));
    if(level!=="all") pool=pool.filter(q=>q.level===level);
    if(!pool.length){notice("目前沒有符合條件的錯題紀錄。");return}
  }else{
    if(!selected.length){notice("請至少選擇一個章節。");return}
    pool=questionBank.filter(q=>selected.includes(q.chapterId));
    if(level!=="all") pool=pool.filter(q=>q.level===level);
    if(!pool.length){notice("你選到的章節或題型目前尚未建置題目。請先選第 7 週，或之後再新增該章題庫。");return}
  }
  const desired=count==="all"?pool.length:Number(count);
  currentQuestions=shuffle(pool).slice(0,Math.min(desired,pool.length));
  renderQuiz(selected,level);
  $("setupPage").classList.remove("active");
  $("quizPage").classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuiz(selected,level){
  const cont=$("quizContainer");
  cont.className=currentMode==="quiz"?"quiz-mode":"";
  cont.innerHTML="";
  const names=selected.map(id=>chapters.find(c=>c.id===id)?.title||id);
  $("quizSummary").innerHTML=`<span class="tag">更新日期：${updatedAt}</span><span class="tag">模式：${modeName(currentMode)}</span><span class="tag">題型：${levelName(level)}</span><span class="tag">題數：${currentQuestions.length} 題</span><span class="tag">章節：${names.length?names.join("、"):"錯題複習"}</span>`;
  currentQuestions.forEach((q,i)=>{
    const ch=chapters.find(c=>c.id===q.chapterId);
    const sec=document.createElement("section");
    sec.className="question";
    sec.dataset.answer=q.answer;
    sec.dataset.id=q.id;
    sec.dataset.answered="false";
    sec.dataset.correct="false";
    const levelTag=q.level==="basic"?"基本題":"應用題";
    sec.innerHTML=`<div class="q-head"><span class="qno">第 ${i+1} 題｜${levelTag}</span><span class="qmeta">第 ${ch?.week||"?"} 週｜${ch?.title||q.chapterId}｜${q.topic}</span></div>
      <div class="qtext">${formatMath(q.text)}</div>
      <div class="math">${formatMath(q.math)}</div>
      <div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option" data-choice="${k}">${k}. ${formatMath(v)}</button>`).join("")}</div>
      <details><summary>提示</summary>${formatMath(q.hint)}</details>
      <div class="explanation"><b>詳解：</b>${formatMath(q.explanation)}</div>`;
    sec.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(sec,btn)));
    cont.appendChild(sec);
  });
  updateScore();
}

function answer(sec,btn){
  if(sec.dataset.answered==="true") return;
  const ok=btn.dataset.choice===sec.dataset.answer;
  sec.dataset.answered="true"; sec.dataset.correct=ok?"true":"false";
  sec.querySelectorAll(".option").forEach(o=>{o.disabled=true;if(o.dataset.choice===sec.dataset.answer)o.classList.add("correct")});
  const mark=document.createElement("div");
  mark.className="result "+(ok?"good":"bad");
  mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";
  if(ok){setWrongIds(getWrongIds().filter(id=>id!==sec.dataset.id))}
  else{btn.classList.add("wrong");setWrongIds([...getWrongIds(),sec.dataset.id])}
  const exp=sec.querySelector(".explanation");
  exp.before(mark); exp.classList.add("show");
  updateScore();
}
function updateScore(){
  let answered=0,correct=0;
  document.querySelectorAll("#quizContainer .question").forEach(q=>{if(q.dataset.answered==="true"){answered++;if(q.dataset.correct==="true")correct++}});
  $("score").textContent=`已答 ${answered} / ${currentQuestions.length}，答對 ${correct} 題`;
}
function backToSetup(){$("quizPage").classList.remove("active");$("setupPage").classList.add("active");window.scrollTo({top:0,behavior:"smooth"})}
