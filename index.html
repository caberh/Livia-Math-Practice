function selectedRadio(n){return document.querySelector(`input[name="${n}"]:checked`).value}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderChapters(){
  const phase=selectedRadio("phase"), grid=$("chapterGrid");
  grid.innerHTML="";
  chapters.filter(ch=>phase==="all"||String(ch.phase)===phase).forEach(ch=>{
    const arr=questionBank.filter(q=>q.chapterId===ch.id), dc=arr.filter(q=>q.diagramSvg).length;

function selectReadyChapters(){selectVisibleChapters(true)}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function formatMath(s){
 let out=escapeHtml(s);
 out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);
 out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);
 out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup>${n}</sup>`);
 return out;
}
function chooseMixed(pool,count){
 if(count==="all")return shuffle(pool);
 const desired=Number(count), basics=shuffle(pool.filter(q=>q.level==="basic")), apps=shuffle(pool.filter(q=>q.level==="application"));
 let appTarget=Math.min(apps.length,Math.max(1,Math.round(desired*0.25)));
 let basicTarget=Math.min(basics.length,desired-appTarget);
 let picked=[...basics.slice(0,basicTarget),...apps.slice(0,appTarget)];
 if(picked.length<desired){const used=new Set(picked.map(q=>q.id));picked=picked.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,desired-picked.length))}
 return shuffle(picked.slice(0,desired));
}
function generateQuiz(){
 clearNotice();
 currentMode=selectedRadio("mode");
 const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);
 const level=selectedRadio("level"), count=selectedRadio("count");
 let pool=[];
 if(currentMode==="wrong"){
   pool=questionBank.filter(q=>getWrongIds().includes(q.id));
   if(selected.length)pool=pool.filter(q=>selected.includes(q.chapterId));
   if(level!=="all")pool=pool.filter(q=>q.level===level);
   if(!pool.length){notice("目前沒有符合條件的錯題紀錄。");return}
 }else{
   if(!selected.length){notice("請先選擇至少一個章節。");return}
   pool=questionBank.filter(q=>selected.includes(q.chapterId));
   if(level!=="all")pool=pool.filter(q=>q.level===level);
 }
 currentQuestions=level==="all"?chooseMixed(pool,count):(count==="all"?shuffle(pool):shuffle(pool).slice(0,Number(count)));
 if(!currentQuestions.length){notice("目前沒有符合條件的題目。");return}
 renderQuiz(selected,level);
 $("setupPage").classList.remove("active");$("quizPage").classList.add("active");scrollTo(0,0);
}
function renderQuiz(selected,level){
 const cont=$("quizContainer");cont.className=currentMode==="quiz"?"quiz-mode":"";cont.innerHTML="";
 const app=currentQuestions.filter(q=>q.level==="application").length, diag=currentQuestions.filter(q=>q.diagramSvg).length;
 $("quizSummary").innerHTML=`<span class="tag">更新日期：${updatedAt}</span><span class="tag">題數：${currentQuestions.length}</span><span class="tag">應用題：${app}</span><span class="tag">圖形題：${diag}</span>`;
 currentQuestions.forEach((q,i)=>{
  const sec=document.createElement("section");sec.className="question";sec.dataset.id=q.id;sec.dataset.answer=q.answer;
  const ch=chapters.find(c=>c.id===q.chapterId);
  sec.innerHTML=`<div class="q-head"><div><div class="qno">第 ${i+1} 題</div><div class="qmeta">第 ${ch.week} 週｜${ch.title}｜${q.level==="basic"?"基本題":"應用題"}｜${q.topic}</div></div></div><div class="qtext">${escapeHtml(q.text)}</div><div class="math">${formatMath(q.math)}</div>${q.diagramSvg?`<div class="diagram-wrap">${q.diagramSvg}</div>`:""}<div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option" data-choice="${k}" onclick="answer(this.closest('.question'),this)">${k}. ${formatMath(v)}</button>`).join("")}</div><details><summary>提示</summary>${formatMath(q.hint)}</details><div class="explanation"><b>詳解：</b>${formatMath(q.explanation)}</div>`;
  cont.appendChild(sec);
 });
 updateScore();
}
function answer(sec,btn){
 if(sec.dataset.answered==="true")return;
 const ok=btn.dataset.choice===sec.dataset.answer;
 sec.dataset.answered="true";sec.dataset.correct=ok?"true":"false";
 sec.querySelectorAll(".option").forEach(o=>{o.disabled=true;if(o.dataset.choice===sec.dataset.answer)o.classList.add("correct")});
 const mark=document.createElement("div");mark.className="result "+(ok?"good":"bad");mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";sec.appendChild(mark);
 if(ok)setWrongIds(getWrongIds().filter(id=>id!==sec.dataset.id));else{const ids=getWrongIds();ids.push(sec.dataset.id);setWrongIds(ids)}
 sec.querySelector(".explanation").classList.add("show");
 updateScore();
}
function updateScore(){let a=0,c=0;document.querySelectorAll("#quizContainer .question").forEach(q=>{if(q.dataset.answered==="true"){a++;if(q.dataset.correct==="true")c++}});$("score").textContent=`已答 ${a} / ${currentQuestions.length}，答對 ${c} 題`}

 const add=(p,m)=>{lines.push((p?"PASS ":"FAIL ")+m);if(!p)ok=false};
 add(questionBank.length===1260,`題庫總數 ${questionBank.length}/1260`);
 for(let w=1;w<=18;w++){
  const arr=questionBank.filter(q=>q.chapterId==="w"+w);
  add(arr.length===70,`第 ${w} 週 70 題`);
  add(arr.filter(q=>q.level==="basic").length===50,`第 ${w} 週基本題 50`);
  add(arr.filter(q=>q.level==="application").length===20,`第 ${w} 週應用題 20`);
  add(new Set(arr.map(q=>q.topic)).size>=10,`第 ${w} 週概念標籤至少 10 種`);
 }
 for(const q of questionBank){ids.add(q.id);sigs.add(q.chapterId+"|"+q.topic+"|"+q.math);add(new Set(Object.values(q.options)).size===4,`${q.id} 選項不重複`)}
 add(ids.size===questionBank.length,"題目 ID 不重複");
 add(sigs.size===questionBank.length,"題目簽名不重複");
 add(questionBank.filter(q=>q.diagramSvg).length>=100,"圖形題數量足夠");
 $("selfCheckBox").textContent=lines.join("\\n")+"\\n"+(ok?"\\nOVERALL: PASS":"\\nOVERALL: FAIL");
}
runSelfCheck();
</script></body></html>
