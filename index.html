  let out=escapeHtml(s);
  out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);
  out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);
  out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup>${n}</sup>`);
  return out;
}
function displayId(q){return q.displayId || q.id.toUpperCase()}
function isDiagram(q){return Boolean(q.diagramSvg)||q.questionType==="diagram"}
function normalizeOption(s){return String(s).replace(/（誤\d+）|\(誤\d+\)/g,"").replace(/\s|　/g,"").replace(/[０-９]/g,d=>"０１２３４５６７８９".indexOf(d))}
function renderChapters(){
  const phase=selectedRadio("phase");
  const grid=$("chapterGrid");
  grid.innerHTML="";
  chapters.filter(ch=>phase==="all"||String(ch.phase)===phase).forEach(ch=>{
    const arr=questionBank.filter(q=>q.chapterId===ch.id);
    const diagramCount=arr.filter(isDiagram).length;
    const advancedCount=arr.filter(q=>q.difficulty==="advanced").length;
    const label=document.createElement("label");
    label.className="chapter-card";
    label.innerHTML=`<input type="checkbox" class="chapter-check" value="${ch.id}"><div class="week">第 ${ch.week} 週｜${ch.date||""}</div><div class="chapter-title">${ch.title}</div><span class="badge">${arr.length} 題</span><span class="badge">圖形 ${diagramCount}</span><span class="badge">進階 ${advancedCount}</span>`;
    const input=label.querySelector("input");
    input.addEventListener("change",()=>label.classList.toggle("selected",input.checked));
    grid.appendChild(label);
  });
}
document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));
renderChapters();

function selectVisibleChapters(checked){
  document.querySelectorAll(".chapter-card").forEach(card=>{
    const input=card.querySelector("input");
    input.checked=checked;
    card.classList.toggle("selected",checked);
  });
}
function applyFilters(pool){
  const level=selectedRadio("level");
  const diff=selectedRadio("difficulty");
  const diagram=selectedRadio("diagram");
  if(level!=="all") pool=pool.filter(q=>q.level===level);
  if(diff!=="all") pool=pool.filter(q=>q.difficulty===diff);
  if(diagram==="diagram") pool=pool.filter(isDiagram);
  if(diagram==="nonDiagram") pool=pool.filter(q=>!isDiagram(q));
  return pool;
}
function chooseQuestions(pool,count){
  const desired=Number(count);
  const level=selectedRadio("level");
  const diff=selectedRadio("difficulty");
  if(level==="all"&&diff==="all"){
    const apps=shuffle(pool.filter(q=>q.level==="application"));
    const basics=shuffle(pool.filter(q=>q.level==="basic"));
    const appTarget=Math.min(apps.length,Math.round(desired*0.25));
    const basicTarget=Math.min(basics.length,desired-appTarget);
    let picked=[...basics.slice(0,basicTarget),...apps.slice(0,appTarget)];
    if(picked.length<desired){
      const used=new Set(picked.map(q=>q.id));
      picked=picked.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,desired-picked.length));
    }
    return shuffle(picked).slice(0,desired);
  }
  return shuffle(pool).slice(0,desired);
}
function generateQuiz(){
  notice("");
  currentMode=selectedRadio("mode");
  const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);
  const count=selectedRadio("count");
  let pool=[];
  if(currentMode==="wrong"){
    pool=questionBank.filter(q=>getWrongIds().includes(q.id));
    if(selected.length) pool=pool.filter(q=>selected.includes(q.chapterId));
  }else{
    if(!selected.length){notice("請至少選擇一個章節。");return}
    pool=questionBank.filter(q=>selected.includes(q.chapterId));
  }
  pool=applyFilters(pool);
  if(!pool.length){notice("目前沒有符合條件的題目。");return}
  currentQuestions=chooseQuestions(pool,count);
  if(!currentQuestions.length){notice("符合條件的題目不足。");return}
  renderQuiz(selected);
  $("setupPage").classList.remove("active");
  $("quizPage").classList.add("active");
  scrollTo(0,0);
}
function formatExplanation(q){
  return `<div class="step"><b>解題方向：</b>${formatMath(q.hint)}</div><div class="step"><b>列式／觀察：</b>${formatMath(q.math)}</div><div class="step"><b>計算：</b>${formatMath(q.explanation)}</div><div class="step"><b>答案：</b>${q.answer}. ${formatMath(q.options[q.answer])}</div>`;
}
function renderQuiz(selected){
  const cont=$("quizContainer");
  cont.className=currentMode==="parent"?"parent-mode":(currentMode==="quiz"?"quiz-mode":"");
  cont.innerHTML="";
  const app=currentQuestions.filter(q=>q.level==="application").length;
  const diagram=currentQuestions.filter(isDiagram).length;
  const advanced=currentQuestions.filter(q=>q.difficulty==="advanced").length;
  const names=selected.map(id=>chapters.find(c=>c.id===id)?.title).filter(Boolean).join("、")||"錯題複習";
  $("quizSummary").innerHTML=`<span class="tag">章節：${names}</span><span class="tag">題數：${currentQuestions.length}</span><span class="tag">應用題：${app}</span><span class="tag">圖形題：${diagram}</span><span class="tag">進階：${advanced}</span><span class="tag">模式：${currentMode==="parent"?"家長檢查":currentMode}</span>`;
  currentQuestions.forEach((q,i)=>{
    const ch=chapters.find(c=>c.id===q.chapterId);
    const sec=document.createElement("section");
    sec.className="question";
    sec.dataset.id=q.id;
    sec.dataset.answer=q.answer;
    const optionButtons=Object.entries(q.options).map(([k,v])=>{
      const cls=(currentMode==="parent"&&k===q.answer)?"option correct":"option";
      const disabled=currentMode==="parent"?"disabled":"";
      return `<button class="${cls}" data-choice="${k}" ${disabled}>${k}. ${formatMath(v)}</button>`;
    }).join("");
    const parentAnswer=currentMode==="parent"?`<div class="parent-answer">正確答案：${q.answer}. ${formatMath(q.options[q.answer])}</div>`:"";
    sec.innerHTML=`<div class="q-head"><div><div class="q-id">${displayId(q)}</div><div class="qmeta">第 ${ch?.week||""} 週｜${ch?.title||""}</div></div><div class="qmeta"><span class="tag">${q.level==="basic"?"基本題":"應用題"}</span><span class="tag">${labelMap[q.difficulty]||q.difficulty}</span><span class="tag">${isDiagram(q)?"圖形題":"非圖形"}</span><span class="tag">${formatMath(q.topic)}</span></div></div><div class="qtext">${i+1}. ${formatMath(q.text)}</div>${q.diagramSvg?`<div class="diagram-wrap">${q.diagramSvg}</div>`:""}<div class="math">${formatMath(q.math)}</div><div class="options">${optionButtons}</div>${parentAnswer}<details class="hint" ${currentMode==="parent"?"open":""}><summary>提示</summary>${formatMath(q.hint)}</details><div class="explanation ${currentMode==="parent"?"show":""}">${formatExplanation(q)}</div>`;
    sec.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(sec,btn)));
    cont.appendChild(sec);
  });
  updateScore();
}
function answer(sec,btn){
  if(sec.dataset.answered==="true") return;
  const ok=btn.dataset.choice===sec.dataset.answer;
  sec.dataset.answered="true";
  sec.dataset.correct=ok?"true":"false";
  sec.querySelectorAll(".option").forEach(o=>{
    o.disabled=true;
    if(o.dataset.choice===sec.dataset.answer)o.classList.add("correct");
    if(o===btn&&!ok)o.classList.add("wrong");
  });
  const mark=document.createElement("div");
  mark.className="result "+(ok?"good":"bad");
  mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";
  if(ok) setWrongIds(getWrongIds().filter(id=>id!==sec.dataset.id));
  else setWrongIds([...getWrongIds(),sec.dataset.id]);
  const exp=sec.querySelector(".explanation");
  exp.before(mark);
  exp.classList.add("show");
  updateScore();
}
function updateScore(){
  if(currentMode==="parent"){
    $("score").textContent=`家長檢查模式｜共 ${currentQuestions.length} 題`;
    return;
  }
  let answered=0,correct=0;
  document.querySelectorAll("#quizContainer .question").forEach(q=>{
    if(q.dataset.answered==="true"){
      answered++;
      if(q.dataset.correct==="true") correct++;
    }
  });
  $("score").textContent=`已答 ${answered} / ${currentQuestions.length}，答對 ${correct} 題`;
}
function backToSetup(){$("quizPage").classList.remove("active");$("setupPage").classList.add("active");scrollTo(0,0)}
function expandHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=true)}
function collapseHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=false)}
function clearWrongBook(){if(confirm("確定清空錯題紀錄嗎？")){setWrongIds([]);alert("已清空錯題紀錄")}}
function runSelfCheck(){
  const lines=[];let ok=true;
  const add=(pass,msg)=>{lines.push((pass?"PASS ":"FAIL ")+msg);if(!pass)ok=false};
  add(questionBank.length===1260,`題庫總數 ${questionBank.length}/1260`);
  const ids=new Set(),sigs=new Set();
  questionBank.forEach(q=>{
    add(!ids.has(q.id),`ID 不重複 ${q.id}`);ids.add(q.id);
    const sig=q.chapterId+"|"+q.text+"|"+q.math;add(!sigs.has(sig),`題目不重複 ${q.id}`);sigs.add(sig);
    add(q.answer in q.options,`答案鍵有效 ${q.id}`);
    add(new Set(Object.values(q.options).map(normalizeOption)).size===4,`選項不重複 ${q.id}`);
    add(Boolean(q.difficulty),`difficulty 已設定 ${q.id}`);
    add(Boolean(q.hint&&q.hint.length>=20),`提示有明確方向 ${q.id}`);
    add(Boolean(q.explanation),`詳解存在 ${q.id}`);
  });
  for(let w=1;w<=18;w++){
    const arr=questionBank.filter(q=>q.chapterId==="w"+w);
    add(arr.length===70,`第 ${w} 週 70 題`);
    add(arr.filter(q=>q.level==="basic").length===50,`第 ${w} 週基本題 50`);
    add(arr.filter(q=>q.level==="application").length===20,`第 ${w} 週應用題 20`);
  }
  add([...document.querySelectorAll('input[name="count"]')].map(x=>x.value).join(",")==="10,20,30","題數選項只保留 10、20、30");
  $("selfCheckBox").textContent=lines.join("\n")+"\n"+(ok?"\nOVERALL: PASS":"\nOVERALL: FAIL");
}
runSelfCheck();
</script></body></html>
