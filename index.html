<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia Math Practice｜私中數學練習產生器</title>
<style>
:root{
  --bg:#fbf7ef;
  --paper:#fffdf8;
  --ink:#2f3f3c;
  --muted:#6c7b76;
  --line:#eadfce;
  --accent:#3f6f64;
  --accent2:#e8f3ef;
  --cream:#fff5d8;
  --right:#4d8d62;
  --wrong:#b86660;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at top left,#f8dfd955,transparent 28%),
    radial-gradient(circle at top right,#dff0f766,transparent 30%),
    var(--bg);
  color:var(--ink);
  line-height:1.65;
}
.wrap{max-width:1160px;margin:auto;padding:28px}
.copyright{position:fixed;right:18px;top:10px;color:var(--muted);font-size:13px;z-index:20}
.hero,.card,.question,details.advanced,details.selfcheck{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 12px 28px rgba(67,81,76,.08);
  padding:22px;
  margin:18px 0;
}
.hero h1{margin:0;font-size:34px}
.subtitle{color:var(--muted)}
.meta-grid,.simple-grid,.advanced-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
.meta,.simple-box,.advanced-box{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fffaf0;
  padding:13px;
}
.simple-box{background:#fff}
.control-title,.label{font-size:13px;color:var(--muted);font-weight:700}
.value{font-weight:900}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin:6px 7px 0 0;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  cursor:pointer;
}
button{
  border:0;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  padding:10px 16px;
  font-weight:800;
  cursor:pointer;
  margin:4px;
}
button.secondary{background:#e7f2f8;color:var(--ink)}
button.warn{background:#f8e3df;color:#823d37}
.chapter-grid{
  display:grid;
  gap:12px;
  margin-top:12px;
}
@media (min-width:760px){
  .chapter-grid{
    grid-template-rows:repeat(9, auto);
    grid-auto-flow:column;
    grid-auto-columns:minmax(0, 1fr);
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
}
@media (max-width:759px){
  .chapter-grid{
    grid-template-columns:1fr;
    grid-auto-flow:row;
  }
}
.chapter-card{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  padding:14px;
  cursor:pointer;
  min-height:110px;
}
.chapter-card input{display:none}
.chapter-card.selected{outline:3px solid #b9d9d0;background:#fbfffd}
.chapter-card.empty-chapter{opacity:.58;background:#f6f1e9}
.chapter-card.empty-chapter{cursor:not-allowed}
.chapter-card.empty-chapter::after{
  content:"待建置";
  display:inline-block;
  background:#f4ded8;
  color:#8a4b42;
  border-radius:999px;
  padding:4px 9px;
  margin-top:6px;
  font-size:12px;
  font-weight:800;
}
.week{font-size:12px;color:var(--muted)}
.chapter-title{font-weight:900}
.badge,.tag{
  display:inline-block;
  background:var(--accent2);
  border-radius:999px;
  padding:4px 9px;
  margin:3px;
  font-size:12px;
}
.page{display:none}
.page.active{display:block}
details.advanced summary,details.selfcheck summary{
  cursor:pointer;
  font-size:18px;
}
.quizbar{
  position:sticky;
  top:0;
  background:#fbf7f0dd;
  backdrop-filter:blur(8px);
  padding:10px;
  z-index:10;
  border-bottom:1px solid var(--line);
}
#score{font-weight:900;margin-left:10px}
.q-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
}
.q-id{font-weight:1000;font-size:18px}
.qmeta{color:var(--muted);font-size:13px}
.qtext{font-size:18px;font-weight:850;margin-top:14px}
.math{
  font-size:18px;
  margin:10px 0;
  background:#f7efe4;
  padding:12px;
  border-radius:16px;
}
.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:10px;
  margin-top:10px;
}
.option{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
  text-align:left;
  border-radius:16px;
  white-space:normal;
}
.option.correct{background:#e7f6e8;border-color:#9accaa}
.option.wrong{background:#fae8e6;border-color:#d99892}
.result{font-weight:900;margin-top:10px}
.good{color:var(--right)}
.bad{color:var(--wrong)}
details.hint{
  background:#fffaf0;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin-top:10px;
}
.quiz-mode details.hint{display:none}
.explanation{
  display:none;
  background:#f7fbf9;
  border-left:5px solid var(--accent);
  border-radius:14px;
  padding:12px;
  margin-top:10px;
}
.explanation.show,.parent-review .explanation{display:block}
.step{margin:8px 0}
.step b{color:var(--accent)}
.parent-answer{
  background:#edf6f2;
  border:1px solid #c8ded6;
  border-radius:14px;
  padding:10px;
  margin-top:10px;
  font-weight:900;
}
.diagram-wrap{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  margin:12px 0;
  overflow:auto;
}
.diagram{max-width:460px;width:100%;height:auto;display:block;margin:auto}
.frac{
  display:inline-flex;
  flex-direction:column;
  vertical-align:middle;
  text-align:center;
  line-height:1.05;
  margin:0 2px;
}
.frac .top{border-bottom:1px solid currentColor;padding:0 2px}
.frac .bottom{padding:0 2px}
.mixed{display:inline-flex;gap:2px;align-items:center}
sup{font-size:.72em}
.selfcheck-box{
  white-space:pre-wrap;
  font-family:ui-monospace,Consolas,monospace;
  background:#263330;
  color:#effaf5;
  border-radius:16px;
  padding:14px;
  overflow:auto;
  margin-top:12px;
}
.footer{text-align:center;color:var(--muted);padding:18px}
@media print{
  .hero,#setupPage,.quizbar,.copyright,.footer{display:none}
  .page{display:block}
  .question{break-inside:avoid;box-shadow:none}
  .option{border:1px solid #999}
}
</style>
</head>
<body>

<div class="copyright">V0.26 © Capt. Caber</div>
<div class="wrap">
  <section class="hero">
    <h1>Livia Math Practice</h1>
    <p class="subtitle">私中數學練習產生器｜單一入口、常用設定展開、進階設定收合</p>
    <div class="meta-grid">
      <div class="meta"><div class="label">更新日期</div><div class="value" id="updateDate"></div></div>
      <div class="meta"><div class="label">題庫</div><div class="value">第 1–7 週已建置｜490 題</div></div>
      <div class="meta"><div class="label">每週配置</div><div class="value">50 基本 + 20 應用</div></div>
      <div class="meta"><div class="label">題數</div><div class="value">10 / 20 / 30</div></div>
    </div>
  </section>

  <main id="setupPage" class="page active">
    <section class="card">
      <h2>1. 選擇章節</h2>
      <button class="secondary" onclick="selectVisibleChapters(true)">全選目前顯示章節</button>
      <button class="secondary" onclick="selectVisibleChapters(false)">清除目前顯示章節</button>
      <button class="secondary" onclick="selectChapter('w7')">選第 7 週</button>
      <div class="chapter-grid" id="chapterGrid"></div>
    </section>

    <section class="card">
      <h2>2. 常用設定</h2>
      <div class="simple-grid">
        <div class="simple-box">
          <div class="control-title">題數</div>
          <label class="pill"><input type="radio" name="count" value="10" checked>10 題</label>
          <label class="pill"><input type="radio" name="count" value="20">20 題</label>
          <label class="pill"><input type="radio" name="count" value="30">30 題</label>
        </div>
        <div class="simple-box">
          <div class="control-title">練習模式</div>
          <label class="pill"><input type="radio" name="mode" value="practice" checked>練習</label>
          <label class="pill"><input type="radio" name="mode" value="quiz">小考</label>
          <label class="pill"><input type="radio" name="mode" value="wrong">錯題複習</label>
        </div>
      </div>
      <p id="setupNotice"></p>
      <button onclick="generateQuiz()">產生試題</button>
    </section>

    <details class="advanced">
      <summary><strong>進階設定</strong>（需要特別練習或檢查題庫時再打開）</summary>
      <div class="advanced-grid">
        <div class="advanced-box">
          <div class="control-title">階段顯示</div>
          <label class="pill"><input type="radio" name="phase" value="all" checked>全部</label>
          <label class="pill"><input type="radio" name="phase" value="1">第一階段</label>
          <label class="pill"><input type="radio" name="phase" value="2">第二階段</label>
        </div>
        <div class="advanced-box">
          <div class="control-title">題型</div>
          <label class="pill"><input type="radio" name="level" value="all" checked>混合</label>
          <label class="pill"><input type="radio" name="level" value="basic">基本題</label>
          <label class="pill"><input type="radio" name="level" value="application">應用題</label>
        </div>
        <div class="advanced-box">
          <div class="control-title">難度</div>
          <label class="pill"><input type="radio" name="difficulty" value="all" checked>全部</label>
          <label class="pill"><input type="radio" name="difficulty" value="basic">基礎</label>
          <label class="pill"><input type="radio" name="difficulty" value="medium">中等應用</label>
          <label class="pill"><input type="radio" name="difficulty" value="advanced">進階應用</label>
        </div>
        <div class="advanced-box">
          <div class="control-title">圖形篩選</div>
          <label class="pill"><input type="radio" name="diagram" value="all" checked>全部</label>
          <label class="pill"><input type="radio" name="diagram" value="diagram">只練圖形題</label>
          <label class="pill"><input type="radio" name="diagram" value="nonDiagram">排除圖形題</label>
        </div>
        <div class="advanced-box">
          <div class="control-title">檢查功能</div>
          <label class="pill"><input type="checkbox" id="parentReview">家長檢查模式：顯示答案與完整詳解</label>
        </div>
      </div>
    </details>

    <details class="selfcheck">
      <summary><strong>Self Check</strong>（點開查看）</summary>
      <div class="selfcheck-box" id="selfCheckBox"></div>
    </details>
  </main>

  <main id="quizPage" class="page">
    <div class="quizbar">
      <button class="secondary" onclick="backToSetup()">返回設定</button>
      <button class="secondary" onclick="generateQuiz()">重新產生</button>
      <button class="secondary" onclick="expandHints()">打開提示</button>
      <button class="secondary" onclick="collapseHints()">收合提示</button>
      <button class="secondary" onclick="window.print()">列印</button>
      <button class="warn" onclick="clearWrongBook()">清空錯題</button>
      <span id="score"></span>
    </div>
    <section class="card">
      <h2>本次練習</h2>
      <div id="quizSummary"></div>
    </section>
    <div id="quizContainer"></div>
  </main>

  <div class="footer">© Capt. Caber｜Livia Math Practice｜index.html</div>
</div>

":"w5","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"某校資優班設計密碼：把起始數 29 先減去 5，再把所得結果放大為 6 倍，最後加上 5。這個密碼是多少？","math":"(29 - 5) × 6 + 5","options":{"A":"149","B":"150","C":"148","D":"151"},"answer":"A","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：29-5=24；再做倍數轉換：24×6=144；最後補回校驗值：144+5=149。","displayId":"W05-Q064","difficulty":"advanced"},{"id":"w5-q065","chapterId":"w5","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"一張闖關卡原有 30 分，第一關扣 6 分，第二關把當時分數變成 2 倍，第三關再補 6 分。完成三關後有幾分？","math":"(30 - 6) × 2 + 6","options":{"A":"55","B":"54","C":"53","D":"56"},"answer":"B","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：30-6=24；再做倍數轉換：24×2=48；最後補回校驗值：48+6=54。","displayId":"W05-Q065","difficulty":"advanced"},{"id":"w5-q066","chapterId":"w5","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"老師給一個數字機器：輸入 31 後，先移走 7，再把留下的量複製成 3 份，最後放回 7。輸出值是多少？","math":"(31 - 7) × 3 + 7","options":{"A":"80","B":"78","C":"79","D":"81"},"answer":"C","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：31-7=24；再做倍數轉換：24×3=72；最後補回校驗值：72+7=79。","displayId":"W05-Q066","difficulty":"advanced"},{"id":"w5-q067","chapterId":"w5","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"某題要求檢查計算流程。小華從 32 開始，先少算 8，接著把剩下的結果乘上 4，最後又加回 8。他得到的數是多少？","math":"(32 - 8) × 4 + 8","options":{"A":"105","B":"103","C":"106","D":"104"},"answer":"D","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：32-8=24；再做倍數轉換：24×4=96；最後補回校驗值：96+8=104。","displayId":"W05-Q067","difficulty":"advanced"},{"id":"w5-q068","chapterId":"w5","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"班級統計一批資料，原有 33 筆，先刪除 3 筆無效資料，再把有效資料依 5 個分類各複製一份，最後補上 3 筆備查資料。總筆數是多少？","math":"(33 - 3) × 5 + 3","options":{"A":"153","B":"154","C":"152","D":"155"},"answer":"A","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：33-3=30； :"應用題：先整理條件再計算。","math":"某數量原有 28，先減少 3，剩下的變成 4 倍，最後再增加 3，結果是多少？","options":{"A":"104","B":"102","C":"103","D":"105"},"answer":"C","hint":"先算括號內剩餘量，再乘倍數，最後加回增加量。","explanation":"列式：(28-3)×4+3=25×4+3=103。","displayId":"W06-Q062","difficulty":"medium"},{"id":"w6-q063","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"升學講義中有一題流程題：起始值為 29，先扣掉 4，剩下的數量經過 5 倍轉換，最後補回 4 作為校驗值。最後是多少？","math":"(29 - 4) × 5 + 4","options":{"A":"130","B":"128","C":"131","D":"129"},"answer":"D","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：29-4=25；再做倍數轉換：25×5=125；最後補回校驗值：125+4=129。","displayId":"W06-Q063","difficulty":"advanced"},{"id":"w6-q064","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"某校資優班設計密碼：把起始數 30 先減去 5，再把所得結果放大為 6 倍，最後加上 5。這個密碼是多少？","math":"(30 - 5) × 6 + 5","options":{"A":"155","B":"156","C":"154","D":"157"},"answer":"A","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：30-5=25；再做倍數轉換：25×6=150；最後補回校驗值：150+5=155。","displayId":"W06-Q064","difficulty":"advanced"},{"id":"w6-q065","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"一張闖關卡原有 31 分，第一關扣 6 分，第二關把當時分數變成 2 倍，第三關再補 6 分。完成三關後有幾分？","math":"(31 - 6) × 2 + 6","options":{"A":"57","B":"56","C":"55","D":"58"},"answer":"B","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：31-6=25；再做倍數轉換：25×2=50；最後補回校驗值：50+6=56。","displayId":"W06-Q065","difficulty":"advanced"},{"id":"w6-q066","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"老師給一個數字機器：輸入 32 後，先移走 7，再把留下的量複製成 3 份，最後放回 7。輸出值是多少？","math":"(32 - 7) × 3 + 7","options":{"A":"83","B":"81","C":"82","D":"84"},"answer":"C","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：32-7=25；再做倍數轉換：25×3=75；最後補回校驗值：75+7=82。","displayId":"W06-Q066","difficulty":"advanced"},{"id":"w6-q067","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"某題要求檢查計算流程。小華從 33 開始，先少算 8，接著把剩下的結果乘上 4，最後又加回 8。他得到的數是多少？","math":"(33 - 8) × 4 + 8","options":{"A":"109","B":"107","C":"110","D":"108"},"answer":"D","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：33-8=25；再做倍數轉換：25×4=100；最後補回校驗值：100+8=108。","displayId":"W06-Q067","difficulty":"advanced"},{"id":"w6-q068","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"班級統計一批資料，原有 34 筆，先刪除 3 筆無效資料，再把有效資料依 5 個分類各複製一份，最後補上 3 筆備查資料。總筆數是多少？","math":"(34 - 3) × 5 + 3","options":{"A":"158","B":"159","C":"157","D":"160"},"answer":"A","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：34-3=31；再做倍數轉換：31×5=155；最後補回校驗值：155+3=158。","displayId":"W06-Q068","difficulty":"advanced"},{"id":"w6-q069","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"數學社準備題卡，原有 35 張，先抽出 4 張示範卡，剩下的每張改成 6 種版本，最後再放回 4 張示範卡。共有幾張題卡？","math":"(35 - 4) × 6 + 4","options":{"A":"191","B":"190","C":"189","D":"192"},"answer":"B","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：35-4=31；再做倍數轉換：31×6=186；最後補回校驗值：186+4=190。","displayId":"W06-Q069","difficulty":"advanced"},{"id":"w6-q070","chapterId":"w6","level":"application","topic":"進階應用：私中考古型多步驟推理","questionType":"text","text":"某私中模擬題把一個數依序處理：從 36 開始，先扣掉 5，中間結果變成 2 倍，最後加回 5。處理後的數是多少？","math":"(36 - 5) × 2 + 5","options":{"A":"68","B":"66","C":"67","D":"69"},"answer":"C","hint":"先分清楚每一步的先後順序，必要時畫成流程圖；最後再檢查是否有反推、比較或校驗條件。","explanation":"先求中間量：36-5=31；再做倍數轉換：31×2=62；最後補回校驗值：62+5=67。","displayId":"W06-Q070","difficulty":"advanced"},{"id":"w7-q001","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"6 × [18 - 3 × (7 - 11)] - 5 × {4 - (-3)}","options":{"A":"146","B":"145","C":"144","D":"147"},"answer":"B","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"(7-11)=-4，所以中括號=18-3×(-4)=30；大式=6×30-5×7=180-35=145。","displayId":"W07-Q001","difficulty":"basic"},{"id":"w7-q002","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"-4 × {12 - [5 × (-3) + 8]} + 7 × (6 - 10)","options":{"A":"-103","B":"-105","C":"-104","D":"-102"},"answer":"C","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"先算中括號：5×(-3)+8=-7；大括號=12-(-7)=19；結果=-4×19+7×(-4)=-76-28=-104。","displayId":"W07-Q002","difficulty":"basic"},{"id":"w7-q003","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"36 ÷ {3 × [2 - (-4)]} - 5 × (-7 + 2)","options":{"A":"28","B":"26","C":"29","D":"27"},"answer":"D","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"中括號=2-(-4)=6；大括號=18；36÷18=2；後段-5×(-5)=+25；合計27。","displayId":"W07-Q003","difficulty":"basic"},{"id":"w7-q004","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"8 - 3 × {9 - [4 × (2 - 6) + 5]}","options":{"A":"-52","B":"-51","C":"-53","D":"-50"},"answer":"A","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"(2-6)=-4，4×(-4)+5=-11；大括號=9-(-11)=20；8-3×20=-52。","displayId":"W07-Q004","difficulty":"basic"},{"id":"w7-q005","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"5 × {[-2 × (9 - 13)] - [6 - 4 × (-3)]}","options":{"A":"-49","B":"-50","C":"-51","D":"-48"},"answer":"B","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"左中括號=-2×(-4)=8；右中括號=6-(-12)=18；差為8-18=-10；乘5得-50。","displayId":"W07-Q005","difficulty":"basic"},{"id":"w7-q006","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"72 ÷ [6 × (5 - 2) - 9] + 4 × (-8 + 11)","options":{"A":"21","B":"19","C":"20","D":"22"},"answer":"C","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"中括號=6×3-9=9；72÷9=8；後段4×3=12；合計20。","displayId":"W07-Q006","difficulty":"basic"},{"id":"w7-q007","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"-3 × {15 - 2 × [4 - (10 - 13)]} + 25","options":{"A":"23","B":"21","C":"24","D":"22"},"answer":"D","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"(10-13)=-3；[4-(-3)]=7；大括號=15-14=1；結果=-3+25=22。","displayId":"W07-Q007","difficulty":"basic"},{"id":"w7-q008","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"4 × {7 - [3 × (-5) - 2 × (8 - 12)]} - 18","options":{"A":"38","B":"39","C":"37","D":"40"},"answer":"A","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"先算3×(-5)=-15，2×(8-12)=2×(-4)=-8；中括號=-15-(-8)=-7；大括號=14；結果56-18=38。","displayId":"W07-Q008","difficulty":"basic"},{"id":"w7-q009","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"90 ÷ {5 × [(-2)^2 + 2]} - 3 × (1 - 9)","options":{"A":"28","B":"27","C":"26","D":"29"},"answer":"B","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"(-2)^2=4，中括號=6，大括號=30；90÷30=3；-3×(-8)=24；合計27。","displayId":"W07-Q009","difficulty":"basic"},{"id":"w7-q010","chapterId":"w7","level":"basic","topic":"整數長式與多層括號","questionType":"text","text":"計算下列長式子的值：","math":"-2 × {3 × [8 - (-6)] - 5 × (4 + 7)}","options":{"A":"27","B":"25","C":"26","D":"28"},"answer":"C","hint":"先從最內層括號開始，每完成一層就重寫一次；括號前若有負號或乘法，先不要心算跳步。","explanation":"[8-(-6)]=14，3×14=42；5×11=55；大括號=42-55=-13；乘-2得26。","displayId":"W07-Q010","difficulty":"basic"},{"id":"w7-q011","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"|-18 + 5 × (-2)^2| - 3^2","options":{"A":"-6","B":"-8","C":"-5","D":"-7"},"answer":"D","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"(-2)^2=4，-18+20=2，絕對值=2；2-9=-7。","displayId":"W07-Q011","difficulty":"basic"},{"id":"w7-q012","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"-2^4 + (-3)^2 × 5 - |7 - 19|","options":{"A":"17","B":"18","C":"16","D":"19"},"answer":"A","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"-2^4 代表 -(2^4)=-16；(-3)^2×5=45；|7-19|=12；結果17。","displayId":"W07-Q012","difficulty":"basic"},{"id":"w7-q013","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"|-5^2 + 4 × (-3)^2| ÷ 11","options":{"A":"2","B":"1","C":"0","D":"3"},"answer":"B","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"-5^2=-25，4×9=36；括號內=11，絕對值=11，11÷11=1。","displayId":"W07-Q013","difficulty":"basic"},{"id":"w7-q014","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"(-2)^3 × [5 - |-9 + 4|] + 6^2 ÷ 9","options":{"A":"5","B":"3","C":"4","D":"6"},"answer":"C","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"|-9+4|=5，所以中括號=0；前段為0，後段36÷9=4。","displayId":"W07-Q014","difficulty":"basic"},{"id":"w7-q015","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"|3 - 5^2| - |(-4)^2 - 20|","options":{"A":"19","B":"17","C":"20","D":"18"},"answer":"D","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"|3-25|=22；|16-20|=4；22-4=18。","displayId":"W07-Q015","difficulty":"basic"},{"id":"w7-q016","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"7 × (-1)^5 - 4 × (-1)^8 + |-13|","options":{"A":"2","B":"3","C":"1","D":"4"},"answer":"A","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"(-1)^5=-1，(-1)^8=1；7×(-1)-4×1+13=2。","displayId":"W07-Q016","difficulty":"basic"},{"id":"w7-q017","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"[-3^2 + (-3)^2] × 8 + |2 - 11|","options":{"A":"10","B":"9","C":"8","D":"11"},"answer":"B","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"-3^2=-9，(-3)^2=9，兩者相加為0；再加|2-11|=9。","displayId":"W07-Q017","difficulty":"basic"},{"id":"w7-q018","chapterId":"w7","level":"basic","topic":"指數、絕對值與負號陷阱","questionType":"text","text":"計算下列式子的值：","math":"48 ÷ |(-2)^3 - 4| + 5 × (-1)^6","options":{"A":"10","B":"8","C":"9","D":"11"},"answer":"C","hint":"先判斷負號有沒有被括號包住，再算次方與絕對值；最後才做乘除與加減。","explanation":"(-2)^3=-8，|-8-4|=12；48÷12=4；5×1=5；合計9。","displayId":"W07-Q018","difficulty":"basic"},{"id":"w7-q019","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"2 1/3 - [3/4 ÷ (-3/8)] + 5/6","options":{"A":"6 1/6","B":"4 1/6","C":"7 1/6","D":"5 1/6"},"answer":"D","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"3/4÷(-3/8)=3/4×(-8/3)=-2；所以2 1/3-(-2)+5/6=7/3+2+5/6=31/6=5 1/6。","displayId":"W07-Q019","difficulty":"basic"},{"id":"w7-q020","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"(-5/6) × [9/10 ÷ (-3/5)] - 1/4","options":{"A":"1","B":"2","C":"0","D":"3"},"answer":"A","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"9/10÷(-3/5)=9/10×(-5/3)=-3/2；(-5/6)×(-3/2)=5/4；5/4-1/4=1。","displayId":"W07-Q020","difficulty":"basic"},{"id":"w7-q021","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"1 3/5 ÷ (-4/5) - [2/3 - 5/6]","options":{"A":"-5/6","B":"-1 5/6","C":"-2 5/6","D":"1/6"},"answer":"B","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"1 3/5=8/5，8/5÷(-4/5)=-2；2/3-5/6=-1/6；-2-(-1/6)=-11/6=-1 5/6。","displayId":"W07-Q021","difficulty":"basic"},{"id":"w7-q022","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"[7/8 - 1/4 × 3] ÷ (-5/8)","options":{"A":"4/5","B":"-1 1/5","C":"-1/5","D":"1 4/5"},"answer":"C","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"中括號=7/8-3/4=1/8；1/8÷(-5/8)=1/8×(-8/5)=-1/5。","displayId":"W07-Q022","difficulty":"basic"},{"id":"w7-q023","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"(-2 1/4) × 4/9 + 5/6 ÷ (-5/3)","options":{"A":"-1/2","B":"-2 1/2","C":"1/2","D":"-1 1/2"},"answer":"D","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"-2 1/4=-9/4；前段=-1。後段=5/6×(-3/5)=-1/2；合計=-1 1/2。","displayId":"W07-Q023","difficulty":"basic"},{"id":"w7-q024","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"3/5 ÷ [(-9/10) × 2/3] + 7/4","options":{"A":"3/4","B":"1 3/4","C":"-1/4","D":"2 3/4"},"answer":"A","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"括號內=-9/10×2/3=-3/5；3/5÷(-3/5)=-1；-1+7/4=3/4。","displayId":"W07-Q024","difficulty":"basic"},{"id":"w7-q025","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"4 1/2 - {5/6 ÷ [(-2/3) × 5/4]}","options":{"A":"6 1/2","B":"5 1/2","C":"4 1/2","D":"7 1/2"},"answer":"B","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"中括號=(-2/3)×5/4=-5/6；5/6÷(-5/6)=-1；4 1/2-(-1)=5 1/2。","displayId":"W07-Q025","difficulty":"basic"},{"id":"w7-q026","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"(-7/12) ÷ 7/8 + [3/4 - (-1/6)]","options":{"A":"1 1/4","B":"-3/4","C":"1/4","D":"2 1/4"},"answer":"C","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"前段=-7/12×8/7=-2/3；中括號=3/4+1/6=11/12；合計=1/4。","displayId":"W07-Q026","difficulty":"basic"},{"id":"w7-q027","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"2/3 × [9/4 - 3/8 ÷ (-3/4)]","options":{"A":"2 5/6","B":"5/6","C":"3 5/6","D":"1 5/6"},"answer":"D","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"3/8÷(-3/4)=3/8×(-4/3)=-1/2；中括號=9/4+1/2=11/4；乘2/3得11/6=1 5/6。","displayId":"W07-Q027","difficulty":"basic"},{"id":"w7-q028","chapterId":"w7","level":"basic","topic":"分數四則長式與帶分數","questionType":"text","text":"計算下列分數長式：","math":"[1 1/2 - (-3/4)] ÷ [5/6 + 1/3]","options":{"A":"1 13/14","B":"2 13/14","C":"13/14","D":"3 13/14"},"answer":"A","hint":"先把帶分數化成假分數，除以分數改成乘倒數；每個括號先單獨算完再合併。","explanation":"左括號=3/2+3/4=9/4；右括號=5/6+1/3=7/6；9/4÷7/6=27/14=1 13/14。","displayId":"W07-Q028","difficulty":"basic"},{"id":"w7-q029","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"0.75 × (-8) + 1/2 ÷ 0.25 - (-3.5)","options":{"A":"1/2","B":"-1/2","C":"-1 1/2","D":"1 1/2"},"answer":"B","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"0.75×(-8)=-6；1/2÷0.25=2；再減-3.5等於加3.5；合計-0.5。","displayId":"W07-Q029","difficulty":"basic"},{"id":"w7-q030","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"1.2 ÷ (-0.3) - [3/5 × (-10)] + 0.4","options":{"A":"3 2/5","B":"1 2/5","C":"2 2/5","D":"4 2/5"},"answer":"C","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"1.2÷(-0.3)=-4；3/5×(-10)=-6；-4-(-6)+0.4=2.4。","displayId":"W07-Q030","difficulty":"basic"},{"id":"w7-q031","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"(-2.5) × [1.6 - 3/4 × 4] + 1.25","options":{"A":"5 3/4","B":"3 3/4","C":"6 3/4","D":"4 3/4"},"answer":"D","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"3/4×4=3；1.6-3=-1.4；(-2.5)×(-1.4)=3.5；加1.25得4.75。","displayId":"W07-Q031","difficulty":"basic"},{"id":"w7-q032","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"[0.6 ÷ (-3/5)] × [2.5 - 1 1/4]","options":{"A":"-1 1/4","B":"-1/4","C":"-2 1/4","D":"3/4"},"answer":"A","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"0.6÷(-3/5)=-1；2.5-1 1/4=1.25；乘得-1.25。","displayId":"W07-Q032","difficulty":"basic"},{"id":"w7-q033","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"4.8 ÷ [(-1.2) × 2] - 3/8 ÷ 0.25","options":{"A":"-2 1/2","B":"-3 1/2","C":"-4 1/2","D":"-1 1/2"},"answer":"B","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"前段4.8÷(-2.4)=-2；後段3/8÷0.25=3/2；合計=-3.5。","displayId":"W07-Q033","difficulty":"basic"},{"id":"w7-q034","chapterId":"w7","level":"basic","topic":"小數與分數混合四則","questionType":"text","text":"計算下列小數與分數混合式：","math":"(-0.4)^2 × 25 - |1/2 - 1.75|","options":{"A":"3 3/4","B":"1 3/4","C":"2 3/4","D":"4 3/4"},"answer":"C","hint":"先把小數化成分數或把分數化成小數，統一形式後再依括號、乘除、加減順序計算。","explanation":"(-0.4)^2=0.16，乘25得4；|0.5-1.75|=1.25；4-1.25=2.75。","displayId":"W07-Q034","difficulty":"basic"},{"id":"w7-q035","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"18 ÷ (-3/2) ÷ 4/5","options":{"A":"-14","B":"-16","C":"-13","D":"-15"},"answer":"D","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"由左到右：18÷(-3/2)=18×(-2/3)=-12；-12÷4/5=-12×5/4=-15。","displayId":"W07-Q035","difficulty":"basic"},{"id":"w7-q036","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"(-7/9) ÷ 14/15 × (-5/6)","options":{"A":"25/36","B":"1 25/36","C":"-11/36","D":"2 25/36"},"answer":"A","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"先把除法改乘倒數：(-7/9)×15/14×(-5/6)；約分後=25/36。","displayId":"W07-Q036","difficulty":"basic"},{"id":"w7-q037","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"5/8 ÷ [(-15/16) ÷ 3/4]","options":{"A":"1/2","B":"-1/2","C":"-1 1/2","D":"1 1/2"},"answer":"B","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"中括號=(-15/16)×4/3=-5/4；5/8÷(-5/4)=5/8×(-4/5)=-1/2。","displayId":"W07-Q037","difficulty":"basic"},{"id":"w7-q038","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"(-24) ÷ [3/5 ÷ (-2/5)] + 6","options":{"A":"23","B":"21","C":"22","D":"24"},"answer":"C","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"括號內=3/5×(-5/2)=-3/2；-24÷(-3/2)=16；再加6得22。","displayId":"W07-Q038","difficulty":"basic"},{"id":"w7-q039","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"[2/3 ÷ (-4/9)] ÷ [5/6 ÷ (-5/3)]","options":{"A":"4","B":"2","C":"5","D":"3"},"answer":"D","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"左括號=2/3×(-9/4)=-3/2；右括號=5/6×(-3/5)=-1/2；相除得3。","displayId":"W07-Q039","difficulty":"basic"},{"id":"w7-q040","chapterId":"w7","level":"basic","topic":"連除、倒數與乘除順序","questionType":"text","text":"計算下列連除式：","math":"12 ÷ (-3) ÷ (-2/5) - 7","options":{"A":"3","B":"4","C":"2","D":"5"},"answer":"A","hint":"連除要由左到右處理；也可以把每個除法都改成乘倒數，但不能任意改變括號位置。","explanation":"12÷(-3)=-4；-4÷(-2/5)=10；10-7=3。","displayId":"W07-Q040","difficulty":"basic"},{"id":"w7-q041","chapterId":"w7","level":"basic","topic":"分配律與提公因數","questionType":"text","text":"利用簡化計算求值：","math":"37 × 18 - 37 × 8 + 37 × (-3)","options":{"A":"260","B":"259","C":"258","D":"261"},"answer":"B","hint":"先觀察每一項是否有共同因數；把共同因數提出來，括號內再做加減，通常比硬算快。","explanation":"三項都有37，提出後為37×(18-8-3)=37×7=259。","displayId":"W07-Q041","difficulty":"basic"},{"id":"w7-q042","chapterId":"w7","level":"basic","topic":"分配律與提公因數","questionType":"text","text":"利用簡化計算求值：","math":"125 × 32 - 25 × 32 + 32 × (-50)","options":{"A":"1601","B":"1599","C":"1600","D":"1602"},"answer":"C","hint":"先觀察每一項是否有共同因數；把共同因數提出來，括號內再做加減，通常比硬算快。","explanation":"三項都有32，提出後32×(125-25-50)=32×50=1600。","displayId":"W07-Q042","difficulty":"basic"},{"id":"w7-q043","chapterId":"w7","level":"basic","topic":"分配律與提公因數","questionType":"text","text":"利用簡化計算求值：","math":"(-18) × 47 + 18 × 27 - 18 × (-6)","options":{"A":"-251","B":"-253","C":"-250","D":"-252"},"answer":"D","hint":"先觀察每一項是否有共同因數；把共同因數提出來，括號內再做加減，通常比硬算快。","explanation":"提出18：18×(-47+27+6)=18×(-14)=-252。","displayId":"W07-Q043","difficulty":"basic"},{"id":"w7-q044","chapterId":"w7","level":"basic","topic":"分配律與提公因數","questionType":"text","text":"利用簡化計算求值：","math":"2.5 × 48 + 2.5 × 52 - 25","options":{"A":"225","B":"226","C":"224","D":"227"},"answer":"A","hint":"先觀察每一項是否有共同因數；把共同因數提出來，括號內再做加減，通常比硬算快。","explanation":"前兩項提出2.5：2.5×(48+52)=250；250-25=225。","displayId":"W07-Q044","difficulty":"basic"},{"id":"w7-q045","chapterId":"w7","level":"basic","topic":"分配律與提公因數","questionType":"text","text":"利用簡化計算求值：","math":"7/9 × 26 - 7/9 × 8 + 7/9 × (-5)","options":{"A":"11 1/9","B":"10 1/9","C":"9 1/9","D":"12 1/9"},"answer":"B","hint":"先觀察每一項是否有共同因數；把共同因數提出來，括號內再做加減，通常比硬算快。","explanation":"提出7/9，得到7/9×(26-8-5)=7/9×13=91/9=10 1/9。","displayId":"W07-Q045","difficulty":"basic"},{"id":"w7-q046","chapterId":"w7","level":"basic","topic":"比較、反推與錯誤步驟","questionType":"text","text":"依題意計算：","math":"若 A = 5 × [3 - (-4)] - 2^4，B = |-18| + 3 × (-2)，求 A - B。","options":{"A":"8","B":"6","C":"7","D":"9"},"answer":"C","hint":"先把每個未知量或每個式子分開算清楚；若是反推題，從等號最後一步做相反運算。","explanation":"A=5×7-16=19；B=18-6=12；A-B=7。","displayId":"W07-Q046","difficulty":"basic"},{"id":"w7-q047","chapterId":"w7","level":"basic","topic":"比較、反推與錯誤步驟","questionType":"text","text":"依題意計算：","math":"在 □ ÷ (-3/4) + 5 = -7 中，□ 應填多少？","options":{"A":"10","B":"8","C":"11","D":"9"},"answer":"D","hint":"先把每個未知量或每個式子分開算清楚；若是反推題，從等號最後一步做相反運算。","explanation":"先把+5移到右邊：□÷(-3/4)=-12；所以□=-12×(-3/4)=9。","displayId":"W07-Q047","difficulty":"basic"},{"id":"w7-q048","chapterId":"w7","level":"basic","topic":"比較、反推與錯誤步驟","questionType":"text","text":"依題意計算：","math":"若 4 × [□ - 2 × (-3)] = 44，求 □。","options":{"A":"5","B":"6","C":"4","D":"7"},"answer":"A","hint":"先把每個未知量或每個式子分開算清楚；若是反推題，從等號最後一步做相反運算。","explanation":"兩邊先除以4，得□-2×(-3)=11；2×(-3)=-6，所以□+6=11，□=5。","displayId":"W07-Q048","difficulty":"basic"},{"id":"w7-q049","chapterId":"w7","level":"basic","topic":"比較、反推與錯誤步驟","questionType":"text","text":"依題意計算：","math":"比較 X = 3/4 ÷ (-1/2) + 2，Y = 5 - | -4 + 1 |，求 X + Y。","options":{"A":"3 1/2","B":"2 1/2","C":"1 1/2","D":"4 1/2"},"answer":"B","hint":"先把每個未知量或每個式子分開算清楚；若是反推題，從等號最後一步做相反運算。","explanation":"X=-3/2+2=1/2；Y=5-3=2；X+Y=2 1/2。","displayId":"W07-Q049","difficulty":"basic"},{"id":"w7-q050","chapterId":"w7","level":"basic","topic":"比較、反推與錯誤步驟","questionType":"text","text":"依題意計算：","math":"小明把 6 - 2 × [3 - 8] 錯算成 (6 - 2) × [3 - 8]，錯誤答案比正確答案少多少？","options":{"A":"37","B":"35","C":"36","D":"38"},"answer":"C","hint":"先把每個未知量或每個式子分開算清楚；若是反推題，從等號最後一步做相反運算。","explanation":"正確：6-2×(-5)=16；錯誤：(6-2)×(-5)=-20；錯誤比正確少16-(-20)=36。","displayId":"W07-Q050","difficulty":"basic"},{"id":"w7-q051","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"某次測驗共 12 題，答對一題得 5 分，答錯一題扣 2 分，未作答 0 分。Livia 答對 8 題、答錯 3 題、未作答 1 題，總分是多少？","math":"8 × 5 + 3 × (-2) + 1 × 0","options":{"A":"35","B":"33","C":"36","D":"34"},"answer":"D","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"把答錯扣分看成負數，總分=40-6+0=34。","displayId":"W07-Q051","difficulty":"medium"},{"id":"w7-q052","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"冰箱溫度原為 -3°C，每小時下降 2°C，3 小時後又上升 5°C。最後溫度是多少°C？","math":"-3 + 3 × (-2) + 5","options":{"A":"-4","B":"-3","C":"-5","D":"-2"},"answer":"A","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"下降用負數，先算3小時下降-6；-3-6+5=-4。","displayId":"W07-Q052","difficulty":"medium"},{"id":"w7-q053","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"一桶果汁有 6 1/2 公升，先倒出 1 3/4 公升，再把剩下的 2/5 平均分給兩組，每組分到多少公升？","math":"(6 1/2 - 1 3/4) × 2/5 ÷ 2","options":{"A":"1 19/20","B":"19/20","C":"-1/20","D":"2 19/20"},"answer":"B","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"剩下=13/2-7/4=19/4；取2/5後為19/10；平均2組得19/20。","displayId":"W07-Q053","difficulty":"medium"},{"id":"w7-q054","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"一條繩子長 18 公尺，第一次剪去全長的 1/3，第二次剪去剩下的 3/4，最後還剩多少公尺？","math":"18 × (1 - 1/3) × (1 - 3/4)","options":{"A":"4","B":"2","C":"3","D":"5"},"answer":"C","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"第一次後剩18×2/3=12；第二次後剩12×1/4=3。","displayId":"W07-Q054","difficulty":"medium"},{"id":"w7-q055","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"某商品標價 960 元，先打 8 折，再使用 120 元折價券，四人平均分攤，每人付多少元？","math":"(960 × 0.8 - 120) ÷ 4","options":{"A":"163","B":"161","C":"164","D":"162"},"answer":"D","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"打8折後=768，扣120得648；648÷4=162。","displayId":"W07-Q055","difficulty":"medium"},{"id":"w7-q056","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"小隊爬山，海拔從 -35 公尺上升 120 公尺，又下降 48 公尺，再上升 2 倍於 18 公尺的高度，最後海拔是多少公尺？","math":"-35 + 120 - 48 + 2 × 18","options":{"A":"73","B":"74","C":"72","D":"75"},"answer":"A","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"最後一次上升2×18=36；總和=-35+120-48+36=73。","displayId":"W07-Q056","difficulty":"medium"},{"id":"w7-q057","chapterId":"w7","level":"application","topic":"中等應用：代數情境與絕對值","questionType":"text","text":"某校記分規則如下：表現分記為 x，合作分記為 y。若 Livia 的 x 為 -3、y 為 4，總評分要把表現分平方後加倍，再扣除 3 組 x 與 y 的乘積，最後加上兩分數差距的絕對值。她的總評分是多少？","math":"2 × (-3)^2 - 3 × (-3) × 4 + |-3 - 4|","options":{"A":"62","B":"61","C":"60","D":"63"},"answer":"B","hint":"先判斷每個文字條件對應到哪一段運算；平方、乘法與絕對值要分開處理後再合併。","explanation":"表現分平方後加倍為18；扣除3組乘積等於加上36；兩分數差距的絕對值為7；合計18+36+7=61。","displayId":"W07-Q057","difficulty":"medium"},{"id":"w7-q058","chapterId":"w7","level":"application","topic":"中等應用：反推原數","questionType":"text","text":"某數字機器會把輸入的數先乘以 -3，再加上 12。若輸出結果是 -15，原本輸入的數是多少？","math":"設原數為 x：-3x + 12 = -15","options":{"A":"10","B":"8","C":"9","D":"11"},"answer":"C","hint":"從輸出結果往回推：先處理最後加上的數，再用相反運算找回原數。","explanation":"先把最後加上的12扣回去，得到-27；再除以-3，原數為9。","displayId":"W07-Q058","difficulty":"medium"},{"id":"w7-q059","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"甲、乙兩種票，甲票每張 180 元，乙票每張 120 元。買甲票 3 張、乙票 5 張，使用 10% 折扣後再加手續費 60 元，共多少元？","math":"(180 × 3 + 120 × 5) × 0.9 + 60","options":{"A":"1087","B":"1085","C":"1088","D":"1086"},"answer":"D","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"原價=540+600=1140；打9折=1026；加手續費60，共1086。","displayId":"W07-Q059","difficulty":"medium"},{"id":"w7-q060","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"某班平均每人捐 75 元，若有 4 人各多捐 25 元，總捐款變成 3100 元。原本全班有幾人？","math":"(3100 - 4 × 25) ÷ 75","options":{"A":"40","B":"41","C":"39","D":"42"},"answer":"A","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"多捐的總額=100；扣回原本平均捐款總額=3000；3000÷75=40。","displayId":"W07-Q060","difficulty":"medium"},{"id":"w7-q061","chapterId":"w7","level":"application","topic":"中等應用：反推括號值","questionType":"text","text":"一台除法機會先把輸入數字加工成「6 減去某數的 2 倍」，再用 48 去除以加工後的結果。若最後輸出為 -12，這個數是多少？","math":"48 ÷ [6 - 2□] = -12","options":{"A":"6","B":"5","C":"4","D":"7"},"answer":"B","hint":"先反推除法中作為除數的括號值，再由括號內的關係找出未知數。","explanation":"除數應為48÷(-12)=-4；所以6-2□=-4，得到-2□=-10，□=5。","displayId":"W07-Q061","difficulty":"medium"},{"id":"w7-q062","chapterId":"w7","level":"application","topic":"中等應用：情境列式與長式子","questionType":"text","text":"某水槽原有 28 公升水，放水每分鐘少 1.5 公升，6 分鐘後再倒入 2 1/4 公升，最後有多少公升？","math":"28 - 1.5 × 6 + 2 1/4","options":{"A":"22 1/4","B":"20 1/4","C":"21 1/4","D":"23 1/4"},"answer":"C","hint":"先把文字中的增加、減少、折扣、平均或反推關係轉成一條完整算式，再依運算順序計算。","explanation":"6分鐘放掉9公升；28-9=19；19+2 1/4=21 1/4。","displayId":"W07-Q062","difficulty":"medium"},{"id":"w7-q063","chapterId":"w7","level":"application","topic":"進階應用：錯誤步驟判斷","questionType":"text","text":"老師出了一題長式子，小明忘記乘除優先，把最前面的減法先做完，才去乘後面的括號。若正確作法與小明作法的兩個答案相差 42，這題的正確檢查過程應得到多少差距？","math":"正確：6 - 2 × [3 - (-5)]；錯誤：(6 - 2) × [3 - (-5)]","options":{"A":"43","B":"41","C":"44","D":"42"},"answer":"D","hint":"先分別算出正確流程與錯誤流程；比較差距時要用兩個結果的距離。","explanation":"括號值為8；正確結果是6-2×8=-10；錯誤結果是(6-2)×8=32；兩者相差42。","displayId":"W07-Q063","difficulty":"advanced"},{"id":"w7-q064","chapterId":"w7","level":"application","topic":"進階應用：多步驟推理與錯誤比較","questionType":"text","text":"一盒餅乾先吃掉 1/4，又把剩下的 2/3 分給朋友，最後自己還有 15 片。原來有多少片？","math":"設原來 x 片：x × (1 - 1/4) × (1 - 2/3) = 15","options":{"A":"60","B":"61","C":"59","D":"62"},"answer":"A","hint":"先把正確算式和題目給的操作順序分開寫；若有反推或錯誤比較，要先求正確值再比較。","explanation":"剩下比例=(3/4)×(1/3)=1/4；x×1/4=15，所以x=60。","displayId":"W07-Q064","difficulty":"advanced"},{"id":"w7-q065","chapterId":"w7","level":"application","topic":"進階應用：多步驟推理與錯誤比較","questionType":"text","text":"甲數為 -8。乙數是甲數的平方減去 5 倍甲數，再除以 4。乙數是多少？","math":"[(-8)^2 - 5 × (-8)] ÷ 4","options":{"A":"27","B":"26","C":"25","D":"28"},"answer":"B","hint":"先把正確算式和題目給的操作順序分開寫；若有反推或錯誤比較，要先求正確值再比較。","explanation":"(-8)^2=64，-5×(-8)=40；64+40=104；104÷4=26。","displayId":"W07-Q065","difficulty":"advanced"},{"id":"w7-q066","chapterId":"w7","level":"application","topic":"進階應用：多步驟推理與錯誤比較","questionType":"text","text":"某遊戲一開始有 100 分，第一關扣掉目前分數的 1/5，第二關加 18 分，第三關再扣掉 42 分，最後分數的 3/4 是多少？","math":"[100 × (1 - 1/5) + 18 - 42] × 3/4","options":{"A":"43","B":"41","C":"42","D":"44"},"answer":"C","hint":"先把正確算式和題目給的操作順序分開寫；若有反推或錯誤比較，要先求正確值再比較。","explanation":"第一關後剩80；加18得98；扣42得56；56×3/4=42。","displayId":"W07-Q066","difficulty":"advanced"},{"id":"w7-q067","chapterId":"w7","level":"application","topic":"進階應用：括號影響比較","questionType":"text","text":"某題中括號表示「先合併一段變化再扣掉」。小華抄題時漏看中括號，變成先乘除、再由左到右加減。若原題起始值為 30，括號內包含 4 倍的負變化與 18 的補正，正確結果和抄錯結果相差多少？","math":"正確：30 - [4 × (-3) + 18]；錯誤：30 - 4 × (-3) + 18","options":{"A":"37","B":"35","C":"38","D":"36"},"answer":"D","hint":"先把中括號內視為一整包變化；再另外計算漏括號後的流程，最後比較兩者。","explanation":"正確流程中，括號內為-12+18=6，所以結果為24；漏括號後為30+12+18=60；相差36。","displayId":"W07-Q067","difficulty":"advanced"},{"id":"w7-q068","chapterId":"w7","level":"application","topic":"進階應用：多步驟推理與錯誤比較","questionType":"text","text":"一數經過以下操作：先加 7，再乘以 -2，最後減去 5，結果為 31。原數是多少？","math":"設原數 x：[x + 7] × (-2) - 5 = 31","options":{"A":"-25","B":"-24","C":"-26","D":"-23"},"answer":"A","hint":"先把正確算式和題目給的操作順序分開寫；若有反推或錯誤比較，要先求正確值再比較。","explanation":"先加5：[-2(x+7)]=36；除以-2得x+7=-18；所以x=-25。","displayId":"W07-Q068","difficulty":"advanced"},{"id":"w7-q069","chapterId":"w7","level":"application","topic":"進階應用：多步驟推理與錯誤比較","questionType":"text","text":"Livia 把 24 題分成三天做。第一天做全部的 1/3，第二天做剩下的 1/2 又多 2 題，第三天剩下幾題？","math":"24 - 24 × 1/3 - [(24 - 24 × 1/3) × 1/2 + 2]","options":{"A":"7","B":"6","C":"5","D":"8"},"answer":"B","hint":"先把正確算式和題目給的操作順序分開寫；若有反推或錯誤比較，要先求正確值再比較。","explanation":"第一天做8題，剩16題；第二天做16×1/2+2=10題；第三天剩6題。","displayId":"W07-Q069","difficulty":"advanced"},{"id":"w7-q070","chapterId":"w7","level":"application","topic":"進階應用：絕對值反推","questionType":"text","text":"某校考古題設計一個距離規則：把一個正整數先做 3 倍變化，再和 -12 合併，最後看它離 0 的距離。若距離是 9，所有可能的正整數之和是多少？","math":"|-12 + 3□| = 9","options":{"A":"9","B":"7","C":"8","D":"10"},"answer":"C","hint":"絕對值代表離0的距離，因此括號內可能是正9，也可能是負9；兩種情況都要檢查是否為正整數。","explanation":"括號內可能為9或-9。若-12+3□=9，得□=7；若-12+3□=-9，得□=1；和為8。","displayId":"W07-Q070","difficulty":"advanced"}];
</script>
<script>
const STORAGE_KEY="liviaMathPracticeWrongIds";
let currentQuestions=[];
let currentMode="practice";
let parentReview=false;
const $=id=>document.getElementById(id);
const labelMap={basic:"基礎",medium:"中等應用",advanced:"進階應用",application:"應用題"};
$("updateDate").textContent=updatedAt;

function selectedRadio(name){return document.querySelector(`input[name="${name}"]:checked`)?.value}
function shuffle(arr){arr=[...arr];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function getWrongIds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}
function setWrongIds(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(ids)]))}
function notice(msg){$("setupNotice").textContent=msg||""}

function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function formatMath(s){
  let out=escapeHtml(s);
  out=out.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);
  out=out.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);
  out=out.replace(/\^(-?\d+)/g,(m,n)=>`<sup>${n}</sup>`);
  return out;
}
function displayId(q){return q.displayId || q.id.toUpperCase()}
function isDiagram(q){return Boolean(q.diagramSvg) || q.questionType==="diagram"}
function normalizeOption(s){return String(s).replace(/（誤\d+）|\(誤\d+\)/g,"").replace(/\s|　/g,"").replace(/[０-９]/g,d=>"０１２３４５６７８９".indexOf(d))}

function renderChapters(){
  const phase=selectedRadio("phase") || "all";
  const grid=$("chapterGrid");
  grid.innerHTML="";
  const counts={};
  questionBank.forEach(q=>counts[q.chapterId]=(counts[q.chapterId]||0)+1);
  chapters.filter(ch=>phase==="all" || String(ch.phase)===phase).forEach(ch=>{
    const arr=questionBank.filter(q=>q.chapterId===ch.id);
    const diagramCount=arr.filter(isDiagram).length;
    const label=document.createElement("label");
    label.className="chapter-card" + (arr.length===0 ? " empty-chapter" : "");
    const empty=arr.length===0;
    label.innerHTML=`<input type="checkbox" class="chapter-check" value="${ch.id}" ${empty?"disabled":""}>
      <div class="week">第 ${ch.week} 週｜${ch.date||""}</div>
      <div class="chapter-title">${ch.title}</div>
      <span class="badge">${arr.length} 題</span>
      <span class="badge">圖形 ${diagramCount}</span>`;
    const input=label.querySelector("input");
    if(empty){
      label.addEventListener("click",e=>{
        e.preventDefault();
        notice(`第 ${ch.week} 週「${ch.title}」題庫待建置，請先選擇第 1–7 週。`);
      });
    }else{
      input.addEventListener("change",()=>label.classList.toggle("selected",input.checked));
    }
    grid.appendChild(label);
  });
}
document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));
renderChapters();

function selectVisibleChapters(checked){
  document.querySelectorAll(".chapter-card:not(.empty-chapter)").forEach(card=>{
    const input=card.querySelector("input");
    input.checked=checked;
    card.classList.toggle("selected",checked);
  });
}
function selectChapter(chapterId){
  document.querySelectorAll(".chapter-card").forEach(card=>{
    const input=card.querySelector("input");
    const checked=input.value===chapterId && !card.classList.contains("empty-chapter");
    input.checked=checked;
    card.classList.toggle("selected",checked);
  });
}

function applyFilters(pool){
  const level=selectedRadio("level") || "all";
  const diff=selectedRadio("difficulty") || "all";
  const diagram=selectedRadio("diagram") || "all";
  if(level!=="all") pool=pool.filter(q=>q.level===level);
  if(diff!=="all") pool=pool.filter(q=>q.difficulty===diff);
  if(diagram==="diagram") pool=pool.filter(isDiagram);
  if(diagram==="nonDiagram") pool=pool.filter(q=>!isDiagram(q));
  return pool;
}

function chooseQuestions(pool,count){
  const desired=Number(count);
  const level=selectedRadio("level") || "all";
  const diff=selectedRadio("difficulty") || "all";
  if(level==="all" && diff==="all"){
    const apps=shuffle(pool.filter(q=>q.level==="application"));
    const basics=shuffle(pool.filter(q=>q.level==="basic"));
    const appTarget=Math.min(apps.length,Math.round(desired*0.25));
    const basicTarget=Math.min(basics.length,desired-appTarget);
    let picked=[...basics.slice(0,basicTarget),...apps.slice(0,appTarget)];
    if(picked.length<desired){
      const used=new Set(picked.map(q=>q.id));
      picked=picked.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,desired-picked.length));
    }
    return shuffle(picked).slice(0,desired);
  }
  return shuffle(pool).slice(0,desired);
}

function generateQuiz(){
  notice("");
  currentMode=selectedRadio("mode") || "practice";
  parentReview=$("parentReview").checked;
  const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value);
  const count=selectedRadio("count") || "10";
  let pool=[];
  if(currentMode==="wrong"){
    pool=questionBank.filter(q=>getWrongIds().includes(q.id));
    if(selected.length) pool=pool.filter(q=>selected.includes(q.chapterId));
  }else{
    if(!selected.length){notice("請至少選擇一個已建置題目的章節。");return}
    pool=questionBank.filter(q=>selected.includes(q.chapterId));
  }
  pool=applyFilters(pool);
  if(!pool.length){notice("目前沒有符合條件的題目。");return}
  currentQuestions=chooseQuestions(pool,count);
  if(!currentQuestions.length){notice("符合條件的題目不足。");return}
  renderQuiz(selected);
  $("setupPage").classList.remove("active");
  $("quizPage").classList.add("active");
  scrollTo(0,0);
}

function formatExplanation(q){
  return `<div class="step"><b>解題方向：</b>${formatMath(q.hint)}</div>
  <div class="step"><b>列式／觀察：</b>${formatMath(q.math)}</div>
  <div class="step"><b>計算：</b>${formatMath(q.explanation)}</div>
  <div class="step"><b>答案：</b>${q.answer}. ${formatMath(q.options[q.answer])}</div>`;
}

function renderQuiz(selected){
  const cont=$("quizContainer");
  cont.className=(parentReview?"parent-review ":"")+(currentMode==="quiz"?"quiz-mode":"");
  cont.innerHTML="";
  const app=currentQuestions.filter(q=>q.level==="application").length;
  const diagram=currentQuestions.filter(isDiagram).length;
  const advanced=currentQuestions.filter(q=>q.difficulty==="advanced").length;
  const names=selected.map(id=>chapters.find(c=>c.id===id)?.title).filter(Boolean).join("、") || "錯題複習";
  $("quizSummary").innerHTML=`<span class="tag">章節：${names}</span><span class="tag">題數：${currentQuestions.length}</span><span class="tag">應用題：${app}</span><span class="tag">圖形題：${diagram}</span><span class="tag">進階：${advanced}</span><span class="tag">${parentReview?"家長檢查":"一般作答"}</span>`;
  currentQuestions.forEach((q,i)=>{
    const ch=chapters.find(c=>c.id===q.chapterId);
    const sec=document.createElement("section");
    sec.className="question";
    sec.dataset.id=q.id;
    sec.dataset.answer=q.answer;
    const optionButtons=Object.entries(q.options).map(([k,v])=>{
      const cls=(parentReview && k===q.answer)?"option correct":"option";
      const disabled=parentReview?"disabled":"";
      return `<button class="${cls}" data-choice="${k}" ${disabled}>${k}. ${formatMath(v)}</button>`;
    }).join("");
    const parentAnswer=parentReview?`<div class="parent-answer">正確答案：${q.answer}. ${formatMath(q.options[q.answer])}</div>`:"";
    sec.innerHTML=`<div class="q-head">
        <div><div class="q-id">${displayId(q)}</div><div class="qmeta">第 ${ch?.week||""} 週｜${ch?.title||""}</div></div>
        <div class="qmeta"><span class="tag">${q.level==="basic"?"基本題":"應用題"}</span><span class="tag">${labelMap[q.difficulty]||q.difficulty}</span><span class="tag">${isDiagram(q)?"圖形題":"非圖形"}</span><span class="tag">${formatMath(q.topic||"")}</span></div>
      </div>
      <div class="qtext">${i+1}. ${formatMath(q.text)}</div>
      ${q.diagramSvg?`<div class="diagram-wrap">${q.diagramSvg}</div>`:""}
      ${q.level==="application" ? "" : `<div class="math">${formatMath(q.math)}</div>`}
      <div class="options">${optionButtons}</div>
      ${parentAnswer}
      <details class="hint" ${parentReview?"open":""}><summary>提示</summary>${formatMath(q.hint)}</details>
      <div class="explanation ${parentReview?"show":""}">${formatExplanation(q)}</div>`;
    sec.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(sec,btn)));
    cont.appendChild(sec);
  });
  updateScore();
}

function answer(sec,btn){
  if(parentReview || sec.dataset.answered==="true") return;
  const ok=btn.dataset.choice===sec.dataset.answer;
  sec.dataset.answered="true";
  sec.dataset.correct=ok?"true":"false";
  sec.querySelectorAll(".option").forEach(o=>{
    o.disabled=true;
    if(o.dataset.choice===sec.dataset.answer) o.classList.add("correct");
    if(o===btn && !ok) o.classList.add("wrong");
  });
  const mark=document.createElement("div");
  mark.className="result "+(ok?"good":"bad");
  mark.textContent=ok?"答對了！":"答錯了，綠色選項是正確答案。";
  if(ok) setWrongIds(getWrongIds().filter(id=>id!==sec.dataset.id));
  else setWrongIds([...getWrongIds(),sec.dataset.id]);
  const exp=sec.querySelector(".explanation");
  exp.before(mark);
  exp.classList.add("show");
  updateScore();
}

function updateScore(){
  if(parentReview){$("score").textContent=`家長檢查｜共 ${currentQuestions.length} 題`;return}
  let answered=0,correct=0;
  document.querySelectorAll("#quizContainer .question").forEach(q=>{
    if(q.dataset.answered==="true"){
      answered++;
      if(q.dataset.correct==="true") correct++;
    }
  });
  $("score").textContent=`已答 ${answered} / ${currentQuestions.length}，答對 ${correct} 題`;
}
function backToSetup(){$("quizPage").classList.remove("active");$("setupPage").classList.add("active");scrollTo(0,0)}
function expandHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=true)}
function collapseHints(){document.querySelectorAll("#quizContainer details").forEach(d=>d.open=false)}
function clearWrongBook(){if(confirm("確定清空錯題紀錄嗎？")){setWrongIds([]);alert("已清空錯題紀錄")}}

function runSelfCheck(){
  const ids=new Set(), sigs=new Set();
  let duplicateId=0, duplicateQuestion=0, duplicateOptions=0, invalidAnswer=0, missingHint=0, missingExplanation=0;
  questionBank.forEach(q=>{
    if(ids.has(q.id)) duplicateId++;
    ids.add(q.id);
    const sig=q.chapterId+"|"+q.text+"|"+q.math;
    if(sigs.has(sig)) duplicateQuestion++;
    sigs.add(sig);
    if(!(q.answer in q.options)) invalidAnswer++;
    if(new Set(Object.values(q.options).map(normalizeOption)).size!==4) duplicateOptions++;
    if(!q.hint || q.hint.length<20) missingHint++;
    if(!q.explanation) missingExplanation++;
  });
  const builtWeeks=[...new Set(questionBank.map(q=>Number((q.chapterId||"").replace("w",""))))].filter(Boolean).sort((a,b)=>a-b);
  const weeklyOk=builtWeeks.every(w=>{
    const arr=questionBank.filter(q=>q.chapterId==="w"+w);
    return arr.length===70 && arr.filter(q=>q.level==="basic").length===50 && arr.filter(q=>q.level==="application").length===20;
  });
  const weeklyDifficultyOk=builtWeeks.every(w=>{
    const arr=questionBank.filter(q=>q.chapterId==="w"+w);
    return arr.filter(q=>q.difficulty==="medium").length===12 && arr.filter(q=>q.difficulty==="advanced").length===8;
  });
  const countOptions=[...document.querySelectorAll('input[name="count"]')].map(x=>x.value).join(",");
  const advancedCollapsed=document.querySelector("details.advanced") && !document.querySelector("details.advanced").open;
  const selfcheckCollapsed=document.querySelector("details.selfcheck") && !document.querySelector("details.selfcheck").open;
  const pass=weeklyOk && weeklyDifficultyOk && duplicateId===0 && duplicateQuestion===0 && duplicateOptions===0 && invalidAnswer===0 && missingHint===0 && missingExplanation===0 && countOptions==="10,20,30" && advancedCollapsed && selfcheckCollapsed;
  $("selfCheckBox").textContent=[
    "目前建置範圍：第 " + (builtWeeks[0]||"-") + "–" + (builtWeeks[builtWeeks.length-1]||"-") + " 週",
    "題庫總數：" + questionBank.length,
    "每週 50 基本 + 20 應用：" + (weeklyOk?"PASS":"FAIL"),
    "每週 12 中等應用 + 8 進階應用：" + (weeklyDifficultyOk?"PASS":"FAIL"),
    "題目 ID 重複：" + duplicateId,
    "題目文字重複：" + duplicateQuestion,
    "同題選項重複：" + duplicateOptions,
    "答案鍵錯誤：" + invalidAnswer,
    "提示不足：" + missingHint,
    "缺少詳解：" + missingExplanation,
    "題數選項：" + countOptions,
    "進階設定預設收合：" + (advancedCollapsed?"PASS":"FAIL"),
    "Self Check 預設收合：" + (selfcheckCollapsed?"PASS":"FAIL"),
    "",
    pass?"OVERALL: PASS":"OVERALL: FAIL"
  ].join("\n");
}
runSelfCheck();
