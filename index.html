const STORAGE_KEY="liviaMathPracticeWrongIds";let currentQuestions=[],currentMode="practice";const $=id=>document.getElementById(id);$("updateDate").textContent=updatedAt;function getWrongIds(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}function setWrongIds(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(ids)]))}function sel(n){return document.querySelector(`input[name="${n}"]:checked`).value}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function hasQ(id){return questionBank.some(q=>q.chapterId===id)}function renderChapters(){const phase=sel("phase"),g=$("chapterGrid");g.innerHTML="";chapters.filter(c=>phase==="all"||String(c.phase)===phase).forEach(c=>{const arr=questionBank.filter(q=>q.chapterId===c.id),dc=arr.filter(q=>q.diagramSvg).length,lab=document.createElement("label");lab.className="chapter-card";lab.innerHTML=`<input type="checkbox" class="chapter-check" value="${c.id}"><div class="week">第 ${c.week} 週｜第 ${c.phase} 階段</div><div class="chapter-title">${c.title}</div><div class="chapter-date">${c.date}</div><span class="badge">${arr.length?arr.length+" 題"+(dc?"｜圖形 "+dc:""):"尚未建置"}</span>`;const input=lab.querySelector("input");input.addEventListener("change",()=>lab.classList.toggle("selected",input.checked));g.appendChild(lab)})}document.querySelectorAll('input[name="phase"]').forEach(r=>r.addEventListener("change",renderChapters));renderChapters();function selectVisibleChapters(v){document.querySelectorAll(".chapter-card").forEach(c=>{const i=c.querySelector("input");i.checked=v;c.classList.toggle("selected",v)})}function selectReadyChapters(){document.querySelectorAll(".chapter-card").forEach(c=>{const i=c.querySelector("input"),v=hasQ(i.value);i.checked=v;c.classList.toggle("selected",v)})}function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function formatMath(s){let o=esc(s);o=o.replace(/(^|[^\d\/])(-?\d+)\s+(\d+)\/(\d+)/g,(m,p,w,n,d)=>`${p}<span class="mixed"><span>${w}</span><span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span></span>`);o=o.replace(/(^|[^\d\/])(-?\d+)\/(\d+)/g,(m,p,n,d)=>`${p}<span class="frac"><span class="top">${n}</span><span class="bottom">${d}</span></span>`);o=o.replace(/\^(-?\d+)/g,(m,n)=>`<sup class="exp">${n}</sup>`);return o}function notice(m){$("setupNotice").textContent=m;$("setupNotice").classList.add("show")}function clearNotice(){$("setupNotice").textContent="";$("setupNotice").classList.remove("show")}function chooseMixed(pool,count){if(count==="all")return shuffle(pool);const n=Number(count),apps=shuffle(pool.filter(q=>q.type==="application")),basics=shuffle(pool.filter(q=>q.type==="basic"));let ac=Math.min(apps.length,Math.max(1,Math.round(n*.25))),bc=Math.min(basics.length,n-ac),pick=[...basics.slice(0,bc),...apps.slice(0,ac)],used=new Set(pick.map(q=>q.id));if(pick.length<n)pick=pick.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,n-pick.length));return shuffle(pick).slice(0,n)}function generateQuiz(){clearNotice();currentMode=sel("mode");const selected=[...document.querySelectorAll(".chapter-check:checked")].map(x=>x.value),qt=sel("qtype"),count=sel("count");let pool=currentMode==="wrong"?questionBank.filter(q=>getWrongIds().includes(q.id)):questionBank.filter(q=>selected.includes(q.chapterId));if(!selected.length&&currentMode!=="wrong"){notice("請至少選擇一個章節。");return}if(qt!=="mixed")pool=pool.filter(q=>q.type===qt);if(!pool.length){notice("沒有符合條件的題目。");return}currentQuestions=qt==="mixed"?chooseMixed(pool,count):shuffle(pool).slice(0,count==="all"?pool.length:Math.min(Number(count),pool.length));renderQuiz(selected,qt);$("setupPage").classList.remove("active");$("quizPage").classList.add("active");scrollTo({top:0,behavior:"smooth"})}function renderVisual(q){return q.diagramSvg?`<div class="diagram-wrap">${q.diagramSvg}</div>`:(q.tableHtml?`<div class="diagram-wrap">${q.tableHtml}</div>`:"")}function renderQuiz(selected,qt){const cont=$("quizContainer");cont.className=currentMode==="quiz"?"quiz-mode":"";cont.innerHTML="";const names=selected.map(id=>chapters.find(c=>c.id===id)?.title||id),apps=currentQuestions.filter(q=>q.type==="application").length,diags=currentQuestions.filter(q=>q.diagramSvg||q.tableHtml).length;$("quizSummary").innerHTML=`<span class="tag">更新日期：${updatedAt}</span><span class="tag">題型：${qt==="mixed"?"混合":qt==="basic"?"基本題":"應用題"}</span><span class="tag">題數：${currentQuestions.length}</span><span class="tag">應用題：${apps}</span><span class="tag">圖形/表格：${diags}</span><span class="tag">章節：${names.join("、")}</span>`;currentQuestions.forEach((q,i)=>{const ch=chapters.find(c=>c.id===q.chapterId),sec=document.createElement("section");sec.className="question";sec.dataset.answer=q.answer;sec.dataset.id=q.id;sec.dataset.answered="false";sec.dataset.correct="false";sec.innerHTML=`<div class="q-head"><span class="qno">第 ${i+1} 題｜${q.type==="basic"?"基本題":"應用題"}</span><span class="qmeta">第 ${ch.week} 週｜${ch.title}｜${q.topic}</span></div><div class="qtext">${formatMath(q.text)}</div>${renderVisual(q)}<div class="math">${formatMath(q.math)}</div><div class="options">${q.choices.map(v=>`<button class="option" data-choice="${esc(v)}">${formatMath(v)}</button>`).join("")}</div><details><summary>提示</summary>${formatMath(q.hint)}</details><div class="explanation"><b>詳解：</b>${formatMath(q.explanation)}</div>`;sec.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>answer(sec,b)));cont.appendChild(sec)});updateScore()}function answer(sec,btn){if(sec.dataset.answered==="true")return;const val=btn.dataset.choice,ok=val===esc(sec.dataset.answer)||val===sec.dataset.answer;sec.dataset.answered="true";sec.dataset.correct=ok?"true":"false";sec.querySelectorAll(".option").forEach(o=>{o.disabled=true;if(o.dataset.choice===esc(sec.dataset.answer)||o.dataset.choice===sec.dataset.answer)o.classList.add("correct")
